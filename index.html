const GLOSSARY=[
['Coaching','Partnering in a thought-provoking and creative process to inspire clients to maximize their personal and professional potential.'],
['Coaching agreement','A mutual understanding of the coaching relationship, roles, goals, process and boundaries.'],
['Session agreement','An understanding of what the client wants to achieve from the current conversation.'],
['Sponsor','A party, often an organization, that pays for or supports coaching services.'],
['Client','The individual or group being coached.'],
['Confidentiality','Protection of information obtained within coaching, subject to agreements and relevant legal limits.'],
['Informed consent','Voluntary agreement based on an adequate understanding of what is proposed and relevant implications.'],
['Conflict of interest','Circumstances in which other interests could compromise or appear to compromise professional judgment.'],
['Dual role','Holding two professional or personal roles in relation to a client, requiring transparent boundaries.'],
['Coaching mindset','An open, curious, flexible, client-centered orientation supported by ongoing self-reflection.'],

['Psychological safety','Conditions in which a client feels respected and able to explore openly without humiliation.'],
['Maintaining presence','Being attentive, flexible and responsive to the unfolding coaching conversation.'],
['Active listening','Listening to words, tone, context, emotion and patterns while checking meaning.'],
['Powerful question','A question that advances the client’s insight or learning rather than the coach’s agenda.'],
['Leading question','A question that implies or steers toward a preferred answer.'],

['Metaphor','A symbolic description that may help a client explore their experience or possibilities.'],
['Awareness','Fresh understanding of self, situation, assumptions, choices or perspective.'],
['Accountability','Client-owned follow-through supported by a mutually agreed reflection or support structure.'],
['Referral','Discussing support from a qualified professional when needs lie outside the scope of coaching.'],
['Consulting','Providing subject-matter analysis or solutions based on specialized expertise.'],
['Mentoring','Developmental guidance often informed by the mentor’s experience.'],
['Facilitation','Supporting the effective process and participation of a group.'],

['Psychotherapy','A clinically qualified service for assessing or treating psychological conditions.'],
['Supervision','Structured professional reflection to support a coach’s effectiveness and ethical practice.'],
['Recontracting','Revisiting the coaching agreement when goals, roles or circumstances change.'],

const STORE='icf-acc-mastery-v1';

const state={view:'dashboard',lesson:1,lessonTab:'overview',practiceFilter:'all',practiceSize:10,adaptive:true,practice:null,exam:data.exam||null,results:data.lastReport||null,showAll:false,flashIndex:0,flashBack:false,reviewTab:'due',glossQuery:'',menu:false};
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
const question=id=>BANK.find(q=>q.id===id);
const now=()=>Date.now();
const dateKey=d=>new Date(d).toLocaleDateString('sv-SE');
const percent=(a,b)=>b?Math.round(a/b*100):0;
const clamp=(x,min,max)=>Math.max(min,Math.min(max,x));
function save(){try{data.exam=state.exam;data.lastReport=state.results;localStorage.setItem(STORE,JSON.stringify(data))}catch(e){console.warn('Local data could not be saved.',e)}}
function statsFor(filter){let subset=BANK.filter(q=>filter==='all'||q.domain===filter||filter===`c${q.comp}`),seen=subset.filter(q=>data.stats[q.id]?.attempts>0),right=seen.filter(q=>data.stats[q.id]?.lastCorrect),mastered=seen.filter(q=>data.stats[q.id]?.streak>=2);return {total:subset.length,attempted:seen.length,accuracy:percent(right.length,seen.length),mastered:mastered.length,coverage:percent(seen.length,subset.length)}}
function dueList(){return BANK.filter(q=>data.stats[q.id]?.misses>0 && data.stats[q.id].due<=now())}
function missList(){return BANK.filter(q=>data.stats[q.id]?.misses>0)}
function formatSeconds(sec){let s=Math.max(0,Math.ceil(sec));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function learningStreak(){let days=new Set((data.history||[]).filter(x=>x.type==='practice'||x.type==='exam').map(x=>dateKey(x.date)));let d=new Date();let run=0;if(!days.has(dateKey(d)))d.setDate(d.getDate()-1);while(days.has(dateKey(d))){run++;d.setDate(d.getDate()-1)}return run}

function render(){const nav=[['dashboard','⌂','Overview'],['learn','▤','Competency lessons'],['practice','◉','Practice questions'],['mock','◷','Mock exam'],['review','↻','Mistake review'],['glossary','▣','Glossary & flashcards'],['sources','↗','Official references']];const p=statsFor('all');document.getElementById('app').innerHTML=`<div class="mobile-head"><b>◈ &nbsp; ACC Mastery</b><button class="menu-toggle" data-act="menu" aria-label="Toggle navigation">☰</button></div><div class="shell"><aside class="sidebar ${state.menu?'open':''}"><div class="brand"><div class="brandmark">AC</div><div><div class="brandname">ACC Mastery</div><small>EXAM LEARNING STUDIO</small></div></div><div class="navcaption">YOUR WORKSPACE</div><nav aria-label="Main navigation">${nav.map(([id,ic,lab])=>`<button class="navbtn ${(state.view===id||(id==='learn'&&state.view==='lesson')||(id==='mock'&&state.view==='results'))?'active':''}" data-act="nav" data-view="${id}"><span class="navicon">${ic}</span>${lab}${id==='review'&&dueList().length?` <span class="pill orange" style="margin-left:auto">${dueList().length}</span>`:''}</button>`).join('')}</nav><div class="sidebottom"><b>Your preparation journey</b><div class="mini-progress"><i style="width:${p.coverage}%"></i></div><div class="tiny">${p.attempted} / ${p.total} questions explored</div><p>Built for the existing ACC written exam. Original practice content · Independent tool.</p></div></aside><main class="main"><div class="topbar"><div class="eyebrow">YOUR COACHING CREDENTIAL JOURNEY</div><div class="topright"><span class="chip dark">● &nbsp; ACC · 2019/2020 exam scope</span><span class="chip">◷ &nbsp; ${BANK.length} practice items</span><div class="avatar" title="Local learning profile">AC</div></div></div>${content()}<footer class="footnote">Independent educational practice tool. Not affiliated with, approved by or endorsed by ICF. Scores here are raw practice percentages—not official scaled exam scores or pass predictions. Progress is saved separately in each browser/device. Use Export / Import to transfer it.</footer></main></div><nav class="mobile-tabs" aria-label="Mobile quick navigation">${[['dashboard','⌂','Home'],['learn','▤','Learn'],['practice','◉','Practice'],['mock','◷','Mock'],['review','↻','Review']].map(([id,ic,lab])=>`<button class="mobile-tab ${(state.view===id||(id==='learn'&&state.view==='lesson')||(id==='mock'&&state.view==='results'))?'active':''}" data-act="nav" data-view="${id}" aria-label="${lab}" ${state.view===id?'aria-current="page"':''}><span class="mt-icon">${ic}</span><span>${lab}</span>${id==='review'&&dueList().length?'<span class="due-dot"></span>':''}</button>`).join('')}</nav>`;window.scrollTo({top:0,behavior:'instant'});updateTimerLabel()}

function dashboard(){let s=statsFor('all'),due=dueList().length,correct=Object.values(data.stats).filter(x=>x.lastCorrect).length,history=(data.history||[]).filter(x=>x.type==='exam');let nextDay=PLAN.findIndex((_,i)=>!data.planDone.includes(i)),reco=nextDay<0?13:nextDay;return `<section class="hero"><div><div class="eyebrow">YOUR PERSONAL ACC LEARNING SPACE</div><h1>Prepare with purpose.<br>Coach with confidence.</h1><p>Study all 8 core competencies, master the exam's 3 content domains, and turn every wrong answer into a learning opportunity.</p><div class="btnrow"><button class="btn white" data-act="quick-practice" data-filter="all">Start a 10-question drill →</button><button class="btn outlinewhite" data-act="nav" data-view="mock">Take full mock exam</button></div></div><div class="hero-illustration"><div class="round-stat"><strong>${s.coverage}%</strong><span>question coverage</span></div></div></section><div class="stats"><div class="stat"><span class="lbl">Question bank explored</span><strong>${s.attempted} <span class="micro">/ ${s.total}</span></strong><span class="sub">${s.coverage}% of original practice items</span></div><div class="stat"><span class="lbl">Latest-answer accuracy</span><strong>${s.attempted?s.accuracy+'%':'—'}</strong><span class="sub">Across unique questions attempted</span></div><div class="stat"><span class="lbl">Due for mistake review</span><strong>${due}</strong><button class="actionlink" data-act="nav" data-view="review">Review weak areas →</button></div><div class="stat"><span class="lbl">Full mock exams</span><strong>${history.length}</strong><span class="sub">${history.length?'Latest '+history[history.length-1].pct+'% raw score':'Your first rehearsal awaits'}</span></div></div><div class="sectionhead"><h2>Exam content blueprint</h2><small>Exactly the published 30 / 30 / 40 weight distribution</small></div>${domainCards()}<div class="sectionhead"><h2>The 8 core competencies</h2><button class="actionlink" data-act="nav" data-view="learn">View learning modules →</button></div><div class="cards">${COMP.slice(1).map((c,i)=>masteryCard(i+1)).join('')}</div><div class="sectionhead"><h2>Your 14-day preparation path</h2><span class="chip">${data.planDone.length} / 14 completed</span></div><div class="layout2"><div class="card"><div class="endrow"><div><div class="eyebrow">UP NEXT · DAY ${reco+1}</div><h3 class="paneltitle" style="margin-top:7px">${PLAN[reco][0]}</h3><p class="smallmuted">${PLAN[reco][1]}</p></div><div class="compnum" style="width:51px;height:51px;font-size:20px">${reco+1}</div></div><div class="btnrow" style="margin-top:15px"><button class="btn" data-act="path-go" data-day="${reco}">Open today's task →</button><button class="btn secondary" data-act="path-toggle" data-day="${reco}">${data.planDone.includes(reco)?'Mark incomplete':'Mark completed'}</button></div><hr class="divider"><div class="endrow micro"><span>${data.planDone.length} learning days completed</span><b>${percent(data.planDone.length,14)}%</b></div><div class="progressline" style="margin-top:7px"><i style="width:${percent(data.planDone.length,14)}%"></i></div></div><div class="card"><div class="eyebrow">HOW THE LEARNING LOOP WORKS</div><h3 class="paneltitle" style="margin-top:9px">Learn → Apply → Review</h3><p class="smallmuted">A missed answer is saved to your review queue. You see a clear rationale, then the question can reappear later in the same drill and in future spaced review sessions.</p><div class="tagrow"><span class="pill">① Learn</span><span class="pill">② Quiz</span><span class="pill orange">③ Fix mistakes</span><span class="pill">④ Re-test</span></div><button class="btn secondary" style="margin-top:15px" data-act="nav" data-view="review">Go to error review</button></div></div><div class="notice amber"><strong>Exam-version clarity:</strong> ICF's current ACC exam page specifies the <b>2019 competencies</b> and <b>2020 Code of Ethics</b> as study foundations. The 2025 versions govern contemporary coaching practice. This tool prioritizes the ACC exam versions and links to both in References.</div>`}

function practiceSetup(){return `<h1 class="page-title">Practice lab</h1><p class="page-lead">Original ACC-style multiple-choice questions: four plausible options, one best answer. Receive feedback instantly, then revisit mistakes until they become strengths.</p><div class="layout2"><div class="card"><div class="eyebrow">CUSTOM PRACTICE SESSION</div><h2 class="paneltitle" style="margin:9px 0 23px">Choose your focus</h2><div class="filterbox"><div><label for="practice-focus" class="fieldlabel">Study area</label><select class="select" id="practice-focus">${[['all','All domains — balanced mix'],['E','Coaching Ethics'],['B','Definition & Boundaries'],['T','Competencies & Techniques'],...COMP.slice(1).map((c,i)=>['c'+(i+1),(i+1)+'. '+c.name])].map(([v,n])=>`<option value="${v}" ${state.practiceFilter===v?'selected':''}>${escapeHTML(n)}</option>`).join('')}</select></div><div><label for="practice-count" class="fieldlabel">Questions</label><select class="select" id="practice-count">${[10,20,30,60,166].map(n=>`<option value="${n}" ${state.practiceSize===n?'selected':''}>${n===166?'All available':n+' questions'}</option>`).join('')}</select></div><div><label for="practice-method" class="fieldlabel">Question selection</label><select class="select" id="practice-method"><option value="smart" ${state.adaptive?'selected':''}>Adaptive / weak first</option><option value="random" ${!state.adaptive?'selected':''}>Random selection</option></select></div></div><div class="notice"><strong>Repetition is active:</strong> missed answers will be flagged, and can reappear later in the same drill. Your overall score measures first attempts only.</div><div class="btnrow"><button class="btn large" data-act="start-practice">Begin practice →</button><button class="btn secondary" data-act="start-due" ${!dueList().length?'disabled':''}>Review ${dueList().length} due questions</button></div></div><aside class="side-panel"><h3>Your learning feedback loop</h3><ol class="bullets" style="font-size:12px"><li>Answer without a timer.</li><li>See the correct answer and explanation immediately.</li><li>Incorrect responses appear in the mistake queue.</li><li>Use spaced reviews to strengthen recall.</li><li>Switch to exam mode when comfortable.</li></ol><hr class="divider"><span class="pill orange">${dueList().length} due for review</span></aside></div>`}
function selectPractice(filter,size,adaptive,onlyIds){let candidates=BANK.filter(q=>onlyIds?onlyIds.includes(q.id):(filter==='all'||q.domain===filter||filter===`c${q.comp}`));if(filter==='all'&&!onlyIds){let desired=size===166?candidates.length:Math.min(size,candidates.length);let quotas={E:Math.round(desired*.3),B:Math.round(desired*.3)};quotas.T=desired-quotas.E-quotas.B;let picks=[];for(let d of ['E','B','T']){let set=candidates.filter(q=>q.domain===d);picks.push(...chooseQuestions(set,quotas[d],adaptive))}return shuffle(picks).map(x=>x.id)}return chooseQuestions(candidates,Math.min(size,candidates.length),adaptive).map(x=>x.id)}
function chooseQuestions(qs,n,adaptive){let list=shuffle(qs);if(adaptive){list.sort((a,b)=>{const score=q=>{let p=data.stats[q.id];if(!p)return 5;if(p.lastCorrect===false)return 9+(p.misses||0)*.2;if(p.due<=now())return 7;if(p.streak>=2)return 0;return 2};return score(b)-score(a)})}return list.slice(0,n)}
function startPractice(filter=state.practiceFilter,size=state.practiceSize,adaptive=state.adaptive,onlyIds=null){let ids=selectPractice(filter,size,adaptive,onlyIds);if(!ids.length){notify('No matching questions yet. Try another filter.');return}state.practice={items:ids,intended:ids.length,pos:0,answerByPos:{},firstResults:{},repeatScheduled:[],closed:false};state.view='practice';save();render()}
function practicePage(){const p=state.practice;if(p.closed)return practiceResultsPage();const id=p.items[p.pos],q=question(id),ord=p.order?.[id]||[0,1,2,3],ans=p.answerByPos[p.pos],answered=ans!==undefined,correct=ans===q.answer,count=Object.keys(p.firstResults).length;return `<div class="endrow" style="margin-bottom:17px"><div><div class="eyebrow">PRACTICE SESSION</div><h1 class="page-title">Build exam instincts</h1></div><span class="pill">No timer · Explanations on</span></div><div class="testlayout"><div class="question-card"><div class="question-top"><span class="qcounter">QUESTION ${p.pos+1} / ${p.items.length} ${p.pos>=p.intended?'· REPEAT':''}</span><span class="pill grey">${DOMAINS[q.domain].name} · C${q.comp}</span></div><h2>${escapeHTML(q.q)}</h2><div class="options">${ord.map((ind,i)=>`<button class="option ${answered?(ind===q.answer?'correct':ind===ans?'wrong':''):(ans===ind?'chosen':'')}" data-act="practice-answer" data-index="${ind}" ${answered?'disabled':''}><span class="letter">${'ABCD'[i]}</span><span>${escapeHTML(q.options[ind])}</span></button>`).join('')}</div>${answered?`<div class="feedback ${correct?'':'no'}"><h4>${correct?'✓ Correct answer':'✕ Not quite — review the reasoning'}</h4><p>${escapeHTML(q.why)}</p>${!correct?`<p style="margin-top:10px"><b>Correct response:</b> ${escapeHTML(q.options[q.answer])}</p>`:''}<p style="margin-top:8px"><b>Competency:</b> ${escapeHTML(COMP[q.comp].name)}${q.topic?' · '+escapeHTML(q.topic):''}</p></div>`:''}<div class="qbottom"><span class="smallmuted">${answered?correct?'Good reasoning. Keep going.':'Added to your mistake review queue.':'Select one response to see feedback.'}</span><div class="btnrow">${answered?`<button class="btn" data-act="practice-next">${p.pos===p.items.length-1?'Finish practice':'Next question'} →</button>`:'<span class="micro">Shortcuts: keys 1–4</span>'}</div></div></div><aside class="side-panel"><h3>Session progress</h3><div class="endrow"><span class="micro">First-pass answered</span><b>${count} / ${p.intended}</b></div><div class="progressline" style="margin:12px 0"><i style="width:${percent(count,p.intended)}%"></i></div><div class="endrow"><span class="micro">First-pass correct</span><b>${Object.values(p.firstResults).filter(Boolean).length}</b></div><hr class="divider"><h3>Why mistakes repeat</h3><p class="smallmuted">One missed item can appear again several questions later. If you correct it, the review interval expands. If you miss it again, it stays due.</p><span class="pill orange">${dueList().length} due now</span><hr class="divider"><button class="btn small ghost" data-act="stop-practice" style="width:100%">End drill & see results</button></aside></div>`}
function recordAttempt(q,idx){let st=data.stats[q.id]||{attempts:0,correct:0,misses:0,streak:0,due:0};let good=idx===q.answer;st.attempts++;st.correct+=good?1:0;st.misses+=good?0:1;st.streak=good?st.streak+1:0;st.lastCorrect=good;st.last=now();st.due=good?now()+[0,86400000,3*86400000,7*86400000,14*86400000][Math.min(st.streak,4)]:now();data.stats[q.id]=st;return good}
function answerPractice(index){let p=state.practice;if(!p||p.closed||p.answerByPos[p.pos]!==undefined)return;let q=question(p.items[p.pos]);p.answerByPos[p.pos]=index;let good=recordAttempt(q,index);if(!(q.id in p.firstResults))p.firstResults[q.id]=good;if(!good&&!p.repeatScheduled.includes(q.id)){p.repeatScheduled.push(q.id);p.items.splice(Math.min(p.items.length,p.pos+5),0,q.id)}data.history.push({type:'practice',date:now(),qid:q.id,correct:good});if(data.history.length>500)data.history=data.history.slice(-500);save();render()}
function finishPractice(){let p=state.practice;if(!p)return;p.closed=true;save();render()}
function practiceResultsPage(){let p=state.practice,first=p.firstResults;let correct=Object.values(first).filter(Boolean).length,n=Object.values(first).length,missed=Object.keys(first).filter(id=>!first[id]);return `<h1 class="page-title">Practice complete</h1><p class="page-lead">Use the explanations and your review queue to close gaps.</p><div class="card report-hero"><div class="scorebig">${percent(correct,n)}%</div><div><h2 class="paneltitle">${correct} / ${n} correct on first encounter</h2><p>${p.items.length-n} planned or delivered repeat exposures · ${dueList().length} total questions currently due for review</p><div class="btnrow" style="margin-top:16px"><button class="btn" data-act="start-due" ${dueList().length?'':'disabled'}>Review due mistakes →</button><button class="btn secondary" data-act="reset-practice">New practice session</button></div></div></div><div class="sectionhead"><h2>First-pass weak answers</h2></div>${missed.length?missed.map(id=>questionReview(id)).join(''):'<div class="reviewempty">Excellent first-pass accuracy. Increase difficulty by trying a timed mock exam.</div>'}`}
function questionReview(id,answer=null){let q=question(id),stat=data.stats[id];let index=answer===null?null:answer;return `<div class="reviewrow"><div class="tagrow"><span class="pill grey">${DOMAINS[q.domain].name}</span><span class="pill grey">C${q.comp} · ${escapeHTML(COMP[q.comp].name)}</span>${stat?.lastCorrect===false?'<span class="pill orange">Latest attempt missed</span>':''}</div><h4>${escapeHTML(q.q)}</h4>${index!==null&&index!==undefined?`<p class="wrongtext"><b>Your response:</b> ${index===-1?'Unanswered':escapeHTML(q.options[index])}</p>`:''}<p class="righttext"><b>Best answer:</b> ${escapeHTML(q.options[q.answer])}</p><p>${escapeHTML(q.why)}</p><button class="actionlink" data-act="lesson" data-comp="${q.comp}">Review competency ${q.comp} →</button></div>`}
function mockSetup(){let count=(data.history||[]).filter(x=>x.type==='exam').length;return `<h1 class="page-title">ACC exam simulator</h1><p class="page-lead">A timed, two-section mock exam designed around the current official ACC structure: 60 original questions, 30 per section and one best answer out of four.</p><div class="layout2"><div><div class="card"><div class="eyebrow">OFFICIAL FORMAT · PRACTICE SIMULATION</div><h2 class="paneltitle" style="margin-top:10px;font-size:22px">Your 90-minute rehearsal</h2><div class="stats" style="grid-template-columns:repeat(3,minmax(0,1fr));margin:20px 0"><div class="stat"><span class="lbl">Questions</span><strong>60</strong><div class="sub">4 options · 1 answer</div></div><div class="stat"><span class="lbl">Timed sections</span><strong>2 × 39</strong><div class="sub">minutes · 30 each</div></div><div class="stat"><span class="lbl">Optional break</span><strong>10</strong><div class="sub">minutes between sections</div></div></div><h3 class="paneltitle">Question distribution in this mock</h3><div class="domain-grid" style="margin:13px 0 21px">${[['18','Ethics'],['18','Boundaries'],['24','Techniques']].map(x=>`<div class="dcard" style="padding:13px"><strong style="font-size:24px">${x[0]}</strong><div class="micro">${x[1]}</div></div>`).join('')}</div><div class="notice amber"><strong>Simulation rule:</strong> Submit Section 1 before proceeding. Once you leave a section, you cannot return to it. Answers are revealed only after finishing the whole mock. No explanations during the test.</div><div class="btnrow"><button class="btn large" data-act="start-mock">Start 60-question mock →</button><button class="btn secondary" data-act="quick-practice" data-filter="all">Warm up with 10 questions</button>${state.results?'<button class="btn secondary" data-act="open-results">View latest detailed report</button>':''}</div></div><div class="sectionhead"><h2>Your prior mock attempts</h2></div>${count?`<div class="card">${data.history.filter(x=>x.type==='exam').slice(-8).reverse().map(x=>`<div class="endrow" style="padding:9px 0;border-bottom:1px solid var(--line)"><div><b>${new Date(x.date).toLocaleDateString()}</b><div class="micro">60 original questions · raw practice score</div></div><strong style="font-size:22px">${x.pct}%</strong></div>`).join('')}</div>`:'<div class="reviewempty">No mock exams yet. Your first full rehearsal starts here.</div>'}</div><aside class="side-panel"><h3>Know the ACC difference</h3><p class="smallmuted">The ACC written exam uses knowledge-based questions with ONE best response. Do not confuse it with the PCC/MCC situational judgment “best and worst response” format.</p><hr class="divider"><h3>Official score vs practice</h3><p class="smallmuted">ICF reports a scaled score from 200 to 600, with 460 as the passing point. Raw percentages in this app <b>cannot</b> be converted reliably into ICF scaled scores.</p><p class="smallmuted">A suggested personal study goal is <b>85%+ on repeated, fresh mocks</b>. This is a study target, not an official pass threshold.</p></aside></div>`}
function startMock(){if(state.exam&&!confirm('Replace the unfinished mock exam with a new one?'))return;let picks={};for(let d of ['E','B','T'])picks[d]=shuffle(BANK.filter(q=>q.domain===d)).slice(0,d==='T'?24:18).map(q=>q.id);let half1=shuffle([...picks.E.slice(0,9),...picks.B.slice(0,9),...picks.T.slice(0,12)]),half2=shuffle([...picks.E.slice(9),...picks.B.slice(9),...picks.T.slice(12)]);let ids=[...half1,...half2],order={};ids.forEach(id=>order[id]=shuffle([0,1,2,3]));state.exam={ids,order,answers:{},flags:[],index:0,phase:'s1',endAt:now()+39*60000,started:now()};state.results=null;state.view='mock';save();render()}
function examSection(){return state.exam?.phase==='s2'?2:1}
function sectionBounds(){return examSection()===1?[0,29]:[30,59]}
function examPage(){let e=state.exam;if(!e)return mockSetup();if(e.phase==='breakPrompt')return `<div class="card break-center"><div class="eyebrow">SECTION 1 COMPLETE</div><h1 class="page-title" style="margin:16px 0">Halfway through your ACC mock.</h1><p class="page-lead" style="margin:13px auto;max-width:530px">Your first 30 answers are locked. You may take an optional 10-minute break before starting the final 30 questions.</p><div class="btnrow" style="justify-content:center"><button class="btn large" data-act="take-break">Take 10-minute break</button><button class="btn secondary large" data-act="skip-break">Skip break · Start Section 2</button></div></div>`;if(e.phase==='break')return `<div class="card break-center"><div class="eyebrow">OPTIONAL BREAK · SECTION 1 LOCKED</div><h1 class="page-title" style="margin:15px 0">Take a moment to reset.</h1><div id="timer" class="timer" data-end="${e.endAt}">${formatSeconds((e.endAt-now())/1000)}</div><p class="page-lead" style="margin:12px auto 24px">Section 2 will begin automatically when the break ends.</p><button class="btn" data-act="skip-break">Start Section 2 now →</button></div>`;if(e.phase==='finished'){state.view='results';return resultsPage()};const q=question(e.ids[e.index]),ord=e.order[q.id],answer=e.answers[q.id],answered=answer!==undefined,[start,end]=sectionBounds(),section=examSection(),sectionAnswered=e.ids.slice(start,end+1).filter(id=>e.answers[id]!==undefined).length,rem=e.endAt-now();return `<div class="endrow" style="margin-bottom:18px"><div><div class="eyebrow">TIMED ACC MOCK EXAM</div><h1 class="page-title">Section ${section} <span class="smallmuted" style="font-weight:500;font-size:16px">of 2</span></h1></div><span class="pill orange">Answers shown after submission</span></div><div class="testlayout"><div class="question-card"><div class="question-top"><span class="qcounter">QUESTION ${e.index-start+1} / 30 &nbsp; · &nbsp; ${sectionAnswered} ANSWERED</span><span class="pill grey">${DOMAINS[q.domain].name}</span></div><h2>${escapeHTML(q.q)}</h2><div class="options">${ord.map((idx,i)=>`<button class="option ${answer===idx?'chosen':''}" data-act="exam-answer" data-index="${idx}"><span class="letter">${'ABCD'[i]}</span><span>${escapeHTML(q.options[idx])}</span></button>`).join('')}</div><div class="qbottom"><button class="btn ghost small" data-act="exam-flag">${e.flags.includes(q.id)?'⚑ Remove flag':'⚑ Flag for review'}</button><div class="btnrow"><button class="btn secondary" data-act="exam-prev" ${e.index<=start?'disabled':''}>← Previous</button>${e.index<end?`<button class="btn" data-act="exam-next">Next →</button>`:`<button class="btn" data-act="exam-end-section">${section===1?'Submit Section 1 →':'Submit final exam →'}</button>`}</div></div></div><aside class="side-panel"><div class="eyebrow">TIME REMAINING</div><div id="timer" class="timer ${rem<5*60000?'urgent':''}" data-end="${e.endAt}">${formatSeconds(rem/1000)}</div><div class="endrow micro" style="margin-top:12px"><span>${sectionAnswered} / 30 answered</span><span>${percent(sectionAnswered,30)}%</span></div><div class="progressline" style="margin:7px 0"><i style="width:${percent(sectionAnswered,30)}%"></i></div><hr class="divider"><h3>Navigate this section</h3><div class="numbergrid">${e.ids.slice(start,end+1).map((id,i)=>`<button aria-label="Question ${i+1}" class="${e.answers[id]!==undefined?'answered':''} ${e.index===start+i?'current':''} ${e.flags.includes(id)?'flagged':''}" data-act="exam-goto" data-index="${start+i}">${i+1}</button>`).join('')}</div><p class="micro">Light green = answered · bottom stripe = flagged</p><button class="btn ghost small" style="width:100%;margin-top:10px" data-act="exam-end-section">${section===1?'Submit section →':'Finish mock →'}</button><hr class="divider"><div class="micro">Keyboard: <span class="kb">1</span> – <span class="kb">4</span> to select · <span class="kb">→</span> next · <span class="kb">←</span> back</div></aside></div>`}
function advanceExamPhase(){let e=state.exam;if(!e)return;if(e.phase==='s1'){e.phase='breakPrompt';e.endAt=null;state.view='mock'}else if(e.phase==='break'){e.phase='s2';e.index=30;e.endAt=now()+39*60000}else if(e.phase==='s2'){submitMock();return}save();render()}
function submitSection(){let e=state.exam;if(!e)return;let [start,end]=sectionBounds(),unanswered=e.ids.slice(start,end+1).filter(id=>e.answers[id]===undefined).length,txt=unanswered?`${unanswered} questions are unanswered in this section and will count as incorrect. You cannot return after continuing. Proceed?`:'Submit this section? You cannot return to it afterward.';if(!confirm(txt))return;advanceExamPhase()}
function submitMock(){let e=state.exam;if(!e)return;let detail=e.ids.map(id=>({id,answer:e.answers[id]??-1,good:e.answers[id]===question(id).answer,domain:question(id).domain,comp:question(id).comp})),correct=detail.filter(x=>x.good).length,domainCounts={};for(const d of ['E','B','T']){let sub=detail.filter(x=>x.domain===d);domainCounts[d]={n:sub.length,right:sub.filter(x=>x.good).length}}for(let x of detail){if(x.answer!==-1)recordAttempt(question(x.id),x.answer)}let result={date:now(),pct:percent(correct,60),correct,detail,domains:domainCounts,seconds:Math.floor((now()-e.started)/1000)};data.history.push({type:'exam',date:result.date,pct:result.pct,correct});data.history=data.history.slice(-500);state.results=result;state.exam=null;state.view='results';state.showAll=false;save();render()}
function updateTimerLabel(){let t=document.getElementById('timer'),e=state.exam;if(!t||!e||!e.endAt)return;t.textContent=formatSeconds((e.endAt-now())/1000);t.classList.toggle('urgent',e.phase!=='break'&&e.endAt-now()<5*60000)}
setInterval(()=>{const e=state.exam;if(!e||!e.endAt)return;if(now()>=e.endAt){if(['s1','s2','break'].includes(e.phase))advanceExamPhase()}else updateTimerLabel()},1000);
function resultsPage(){let r=state.results;if(!r)return `<h1 class="page-title">No exam report yet</h1><p class="page-lead">Start a full timed mock to generate a detailed competency breakdown.</p><button class="btn" data-act="nav" data-view="mock">Open mock exam →</button>`;let wrong=r.detail.filter(x=>!x.good),shown=state.showAll?r.detail:wrong;return `<div class="eyebrow">ACC MOCK · FINAL REPORT</div><h1 class="page-title" style="margin-top:10px">Your rehearsal results</h1><p class="page-lead">${new Date(r.date).toLocaleString()} · Original practice exam · No official scoring conversion.</p><div class="card report-hero"><div class="scorebig" style="color:${r.pct>=85?'#16836a':'#b78040'}">${r.pct}%</div><div><h2 class="paneltitle">${r.correct} of 60 correct</h2><p>${r.pct>=85?'Strong raw practice result. Keep testing with fresh questions.':'Good diagnostic information. Review missed concepts, then take a fresh attempt.'}</p><p class="micro">ICF's official scaled passing score is 460 on a 200–600 scale. Your ${r.pct}% here is <b>not</b> an official scaled score or pass prediction.</p><div class="btnrow" style="margin-top:14px"><button class="btn" data-act="start-due" ${dueList().length?'':'disabled'}>Practice due mistakes →</button><button class="btn secondary" data-act="nav" data-view="mock">New mock exam</button></div></div></div><div class="sectionhead"><h2>Performance by exam domain</h2></div><div class="report-cards">${Object.entries(DOMAINS).map(([d,v])=>{let x=r.domains[d];return `<div class="card"><div class="eyebrow">${v.weight}% OF EXAM</div><h3 style="font-size:14px;margin:8px 0">${v.name}</h3><strong style="font-size:29px">${percent(x.right,x.n)}%</strong><div class="micro">${x.right} / ${x.n} correct</div><div class="progressline" style="margin-top:12px"><i style="width:${percent(x.right,x.n)}%"></i></div><button class="actionlink" style="margin-top:12px" data-act="quick-practice" data-filter="${d}">Practice this area →</button></div>`}).join('')}</div><div class="sectionhead"><h2>Question review · ${wrong.length} incorrect or unanswered</h2><button class="btn secondary small" data-act="toggle-report">${state.showAll?'Show only missed':'Show all 60'}</button></div><div class="notice">Reviewing explanations is part of learning. When you retake a mock, the app creates a fresh randomized set from the ${BANK.length}-item bank, with the same 30/30/40 domain distribution.</div>${shown.length?shown.map(x=>questionReview(x.id,x.answer)).join(''):'<div class="reviewempty">All 60 questions correct. Excellent work! Keep your preparation grounded in the official ICF references.</div>'}`}
function reviewPage(){let due=dueList(),all=missList(),which=state.reviewTab==='due'?due:all;let c=statsFor('all');return `<h1 class="page-title">Turn missed answers into mastery</h1><p class="page-lead">Every incorrect response is remembered locally. Review the explanation, revisit the relevant competency, then test yourself again using spaced repetition.</p><div class="stats" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="stat"><span class="lbl">Ever missed</span><strong>${all.length}</strong><span class="sub">Distinct questions</span></div><div class="stat"><span class="lbl">Due for review now</span><strong>${due.length}</strong><span class="sub">Ready to practice again</span></div><div class="stat"><span class="lbl">Strong recall</span><strong>${Object.values(data.stats).filter(x=>x.streak>=2).length}</strong><span class="sub">Two or more recent correct answers</span></div></div><div class="tabs"><button class="tab ${state.reviewTab==='due'?'active':''}" data-act="review-tab" data-tab="due">Due now (${due.length})</button><button class="tab ${state.reviewTab==='all'?'active':''}" data-act="review-tab" data-tab="all">All errors (${all.length})</button></div><div class="btnrow" style="margin:0 0 18px"><button class="btn" data-act="review-practice" data-kind="${state.reviewTab}" ${which.length?'':'disabled'}>Test ${which.length} questions again →</button><button class="btn secondary" data-act="quick-practice" data-filter="all">Fresh adaptive practice</button></div>${which.length?which.map(q=>questionReview(q.id)).join(''):`<div class="reviewempty"><div style="font-size:28px">✓</div><h3>${state.reviewTab==='due'?'No mistakes due right now':'No incorrect answers recorded yet'}</h3><p>${state.reviewTab==='due'?'Correct answers return for later spaced reviews. Keep learning with a new drill.':'Begin a practice set or mock and this section will track concepts to revisit.'}</p><button class="btn" data-act="quick-practice" data-filter="all">Start a new drill →</button></div>`}<div class="notice"><strong>Review scheduling:</strong> wrong = immediately due; after correct responses, revisit after approximately 1, 3, 7, then 14 days. The same question can also repeat within a practice session.</div>`}
function glossaryPage(){let match=GLOSSARY.filter(([a,b])=>(a+' '+b).toLowerCase().includes(state.glossQuery.toLowerCase()));let idx=clamp(state.flashIndex,0,Math.max(0,GLOSSARY.length-1));let [term,def]=GLOSSARY[idx];return `<h1 class="page-title">Coaching concept cards</h1><p class="page-lead">Consolidate definitions and distinctions that recur in ACC exam questions. Click a flashcard to reveal its meaning.</p><div class="layout2"><div><div class="card"><div class="eyebrow">FLASHCARDS · ${idx+1} / ${GLOSSARY.length}</div><button class="flashcard" data-act="flash-flip"><small>${state.flashBack?'DEFINITION':'TERM'}</small><h3>${escapeHTML(state.flashBack?def:term)}</h3><span>↺ &nbsp; Click to flip</span></button><div class="flashcontrols"><button class="btn secondary" data-act="flash-prev">← Previous</button><span class="micro">${idx+1} of ${GLOSSARY.length}</span><button class="btn" data-act="flash-next">Next →</button></div></div><div class="sectionhead"><h2>Searchable coaching glossary</h2></div><input id="gloss-search" class="search" type="search" placeholder="Search concepts and meanings…" value="${escapeHTML(state.glossQuery)}" aria-label="Search coaching glossary"><div id="gloss-results">${glossaryResults(match)}</div></div><div class="side-panel"><h3>High-yield distinctions</h3><ul class="bullets" style="font-size:12px"><li><b>Coaching</b> — client thinking and choice.</li><li><b>Consulting</b> — expert solutions.</li><li><b>Training</b> — building predefined skills.</li><li><b>Mentoring</b> — guidance from experience.</li><li><b>Therapy</b> — clinical assessment and treatment.</li><li><b>Facilitation</b> — guiding group process.</li></ul><button class="btn secondary small" data-act="quick-practice" data-filter="B">Practice boundaries →</button></div></div>`}
function glossaryResults(match){return `<div style="margin-top:12px">${match.length?match.map(([a,b])=>`<div class="reviewrow"><h4>${escapeHTML(a)}</h4><p>${escapeHTML(b)}</p></div>`).join(''):'<p class="smallmuted">No matching concepts.</p>'}</div>`}
function sourcesPage(){return `<h1 class="page-title">Your official learning sources</h1><p class="page-lead">This study tool was constructed around ICF's official ACC exam guidance, sample question structure, competency model and reference recommendations. Open the original materials to verify rules and deepen your understanding.</p><div class="notice amber"><strong>Which versions matter?</strong> ICF's ACC exam webpage states the existing ACC exam is based on the <b>2019 Core Competencies</b> and the <b>2020 Code of Ethics</b>. Professional practice also needs the updated 2025 standards. This app emphasizes the exam's specified versions.</div><div class="source-list">${SOURCES.map(([title,url,description],i)=>`<a class="sourcelink" target="_blank" rel="noopener noreferrer" href="${escapeHTML(url)}"><div class="endrow"><div><div class="eyebrow" style="font-size:10px">SOURCE ${String(i+1).padStart(2,'0')} · ${i<5?'PRIMARY EXAM RESOURCE':'FURTHER LEARNING'}</div><strong style="margin-top:5px">${escapeHTML(title)}</strong><small>${escapeHTML(description)}</small></div><span style="font-size:22px;color:#5f9c90">↗</span></div></a>`).join('')}</div><div class="sectionhead"><h2>Methodology & limitations</h2></div><div class="card"><p>All ${BANK.length} questions and answer explanations in this file are <b>original practice material</b>. Their format follows the official ACC example: a short knowledge-based question (often with a small scenario), four responses and exactly one best answer. They are not leaked, reproduced or authenticated live examination items.</p><p>The mock replicates the official 60-question count, 18/18/24 domain mix, two sections, 39-minute per-section pacing and optional 10-minute break. Screen presentation is inspired by conventional test interfaces, not a reproduction of proprietary Pearson VUE software.</p><p>Question quality, difficulty and actual ICF pass-score equating cannot be independently validated. Your raw score in this practice tool should guide studying, not predict a credentialing outcome. The latest ICF candidate communications always take precedence.</p><p>ICF's Coachbock and paid ACC Exam Study System are referenced as optional official resources; this file does not include their copyrighted contents.</p></div><div class="sectionhead"><h2>Progress management</h2></div><div class="card"><p class="smallmuted">Answers, mock exams, review intervals and learning-path checks are saved in this browser only. Export a backup before switching browsers or devices.</p><div class="btnrow"><button class="btn secondary" data-act="export">↓ Export my progress (JSON)</button><button class="btn secondary" data-act="import">↑ Import progress</button><button class="btn danger" data-act="reset-all">Reset all progress</button><input id="import-file" class="hide" type="file" accept="application/json,.json"></div></div>`}
function planGo(day){const code=PLAN[day][2];if(code==='baseline'){startPractice('all',30,false)}else if(code.startsWith('c')){state.lesson=parseInt(code.slice(1));state.lessonTab='overview';state.view='lesson';render()}else if(code==='B'||code==='eb'){startPractice(code==='eb'?'all':'B',code==='eb'?30:20,true,code==='eb'?BANK.filter(q=>q.domain==='E'||q.domain==='B').map(q=>q.id):null)}else if(code==='review'){navTo('review')}else if(code==='mock'||code==='final'){navTo('mock')}else{navTo('practice')}}
function doAction(el){const action=el.dataset.act;switch(action){case'menu':state.menu=!state.menu;render();break;case'nav':navTo(el.dataset.view);break;case'lesson':state.lesson=Number(el.dataset.comp);state.lessonTab='overview';state.view='lesson';render();break;case'lesson-tab':state.lessonTab=el.dataset.tab;render();break;case'quick-practice':startPractice(el.dataset.filter||'all',10,true);break;case'start-practice':startPractice(document.getElementById('practice-focus').value,+document.getElementById('practice-count').value,document.getElementById('practice-method').value==='smart');break;case'start-due':if(dueList().length)startPractice('all',dueList().length,false,dueList().map(q=>q.id));break;case'practice-answer':answerPractice(+el.dataset.index);break;case'practice-next':if(state.practice.pos+1>=state.practice.items.length)finishPractice();else{state.practice.pos++;render()}break;case'stop-practice':finishPractice();break;case'reset-practice':state.practice=null;state.view='practice';render();break;case'start-mock':startMock();break;case'exam-answer':if(state.exam&&['s1','s2'].includes(state.exam.phase)){state.exam.answers[state.exam.ids[state.exam.index]]=+el.dataset.index;save();render()}break;case'exam-prev':state.exam.index=Math.max(sectionBounds()[0],state.exam.index-1);save();render();break;case'exam-next':state.exam.index=Math.min(sectionBounds()[1],state.exam.index+1);save();render();break;case'exam-goto':state.exam.index=+el.dataset.index;save();render();break;case'exam-flag':{let id=state.exam.ids[state.exam.index],f=state.exam.flags;state.exam.flags=f.includes(id)?f.filter(x=>x!==id):[...f,id];save();render();break}case'exam-end-section':submitSection();break;case'take-break':state.exam.phase='break';state.exam.endAt=now()+10*60000;save();render();break;case'skip-break':state.exam.phase='s2';state.exam.index=30;state.exam.endAt=now()+39*60000;save();render();break;case'toggle-report':state.showAll=!state.showAll;render();break;case'open-results':state.view='results';render();break;case'review-tab':state.reviewTab=el.dataset.tab;render();break;case'review-practice':{let ids=(el.dataset.kind==='due'?dueList():missList()).map(q=>q.id);startPractice('all',ids.length,false,ids);break}case'flash-flip':state.flashBack=!state.flashBack;render();break;case'flash-next':state.flashIndex=(state.flashIndex+1)%GLOSSARY.length;state.flashBack=false;render();break;case'flash-prev':state.flashIndex=(state.flashIndex-1+GLOSSARY.length)%GLOSSARY.length;state.flashBack=false;render();break;case'path-go':planGo(+el.dataset.day);break;case'path-toggle':{let i=+el.dataset.day;data.planDone=data.planDone.includes(i)?data.planDone.filter(x=>x!==i):[...data.planDone,i];save();render();break}case'export':{let blob=new Blob([JSON.stringify({version:1,exported:new Date().toISOString(),progress:{...data,exam:state.exam}},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='acc-mastery-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);break}case'import':document.getElementById('import-file').click();break;case'reset-all':if(confirm('Permanently delete all saved answers, exam results and learning progress from this browser?')){localStorage.removeItem(STORE);data.stats={};data.history=[];data.planDone=[];data.exam=null;data.lastReport=null;state.practice=null;state.exam=null;state.results=null;navTo('dashboard');notify('Local progress reset.')}break;}}
document.addEventListener('click',e=>{let b=e.target.closest('[data-act]');if(b&&!b.disabled){if(b.dataset.act==='lesson'&&b.getAttribute('role')==='button'){}e.preventDefault();doAction(b)}});
document.addEventListener('keydown',e=>{let target=e.target;if(target?.matches('input,textarea,select')||e.altKey||e.ctrlKey||e.metaKey)return;const isPractice=state.view==='practice'&&state.practice&&!state.practice.closed,isMock=state.view==='mock'&&state.exam&&['s1','s2'].includes(state.exam.phase);if((isPractice||isMock)&&['1','2','3','4'].includes(e.key)){let i=Number(e.key)-1;if(isPractice&&state.practice.answerByPos[state.practice.pos]!==undefined)return;let q=isPractice?question(state.practice.items[state.practice.pos]):question(state.exam.ids[state.exam.index]);let order=isPractice?(state.practice.order?.[q.id]||[0,1,2,3]):state.exam.order[q.id];if(isPractice)answerPractice(order[i]);else{state.exam.answers[q.id]=order[i];save();render()}e.preventDefault()}else if(isMock&&e.key==='ArrowRight'){doAction({dataset:{act:'exam-next'}});e.preventDefault()}else if(isMock&&e.key==='ArrowLeft'){doAction({dataset:{act:'exam-prev'}});e.preventDefault()}else if(e.key==='Enter'&&target?.getAttribute('role')==='button'&&target.dataset.act==='lesson'){doAction(target)}});
document.addEventListener('input',e=>{if(e.target.id==='gloss-search'){state.glossQuery=e.target.value;let x=GLOSSARY.filter(([a,b])=>(a+' '+b).toLowerCase().includes(state.glossQuery.toLowerCase()));document.getElementById('gloss-results').innerHTML=glossaryResults(x)}});
document.addEventListener('change',async e=>{if(e.target.id==='import-file'){const file=e.target.files?.[0];if(!file)return;try{let obj=JSON.parse(await file.text());let p=obj.progress;if(!p||!p.stats||!Array.isArray(p.history)||!Array.isArray(p.planDone))throw Error('Invalid progress file');if(!confirm('Replace local progress with the imported backup?'))return;data.stats=p.stats;data.history=p.history;data.planDone=p.planDone;state.exam=p.exam||null;state.results=p.lastReport||null;save();navTo('dashboard');notify('Progress restored.')}catch(e){alert('Could not import progress: '+e.message)}}});
// Randomize response positions in each practice drill so the correct answer is never predictably choice A.
const _startPractice=startPractice;
startPractice=function(filter=state.practiceFilter,size=state.practiceSize,adaptive=state.adaptive,onlyIds=null){_startPractice(filter,size,adaptive,onlyIds);if(state.practice){let o={};for(let id of state.practice.items)o[id]=shuffle([0,1,2,3]);state.practice.order=o;render()}};
// Keep navigation and timer state available after a page refresh.
if(state.exam?.endAt&&state.exam.endAt<=now()){if(state.exam.phase==='s1'){state.exam.phase='breakPrompt';state.exam.endAt=null}else if(state.exam.phase==='break'){state.exam.phase='s2';state.exam.index=30;state.exam.endAt=now()+39*60000}else if(state.exam.phase==='s2'){submitMock()}}
if(state.exam)state.view='mock';
render();
if(location.protocol==='https:' && 'serviceWorker' in navigator){navigator.serviceWorker.register('./service-worker.js').catch(()=>{});}
</script>
</body>
</html>
