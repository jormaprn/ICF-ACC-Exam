  BANK.push({id:`Q${String(BANK.length+1).padStart(3,'0')}`,domain:d,comp:c,q,options:[correct,w1,w2,w3],answer:0,why,topic});
}
// ETHICS — 45 original items. E = Coaching Ethics.
add('E',1,'A sponsoring employer asks the coach for a verbatim transcript of an employee’s coaching session. What is the BEST initial response?','Follow the agreed confidentiality terms and seek the client’s explicit authorization before any disclosure.','Send the transcript because the employer pays.','Provide a summary without telling the client.','Refuse any conversation with the sponsor under all circumstances.','Payment does not override the client’s confidentiality. Agreements define what may be shared; seek informed permission before disclosing content.','Sponsor confidentiality');
add('E',1,'A coach discovers that a potential client is also a close family friend. What should the coach do FIRST?','Disclose the potential conflict and assess whether boundaries and impartiality can be maintained.','Accept without discussion because friendship builds trust.','Reject automatically; personal relationships are always prohibited.','Ask the friend to keep the relationship secret.','Recognize and openly manage a potential multiple relationship rather than assuming it is harmless or automatically forbidden.','Conflict of interest');
add('E',1,'Before recording a coaching conversation for supervision, the coach should:','Obtain informed consent and clarify who will access, store and hear the recording.','Record secretly and delete the file after listening.','Inform only the supervisor.','Assume consent is included in any verbal coaching agreement.','Specific informed consent and secure handling are essential whenever a recording can identify a client.','Recording consent');
add('E',1,'Which conduct most clearly breaches professional coaching ethics?','Beginning an intimate or romantic relationship with a current coaching client.','Maintaining secure client notes.','Requesting feedback about the coaching process.','Declining an engagement outside the coach’s competence.','A romantic or sexual relationship with a current client undermines professional boundaries and is prohibited.','Professional boundaries');
add('E',1,'A coach wants to publish a success story naming a client. What is required?','The client’s explicit permission for the specific use of their identity and story.','Only the coach’s belief that the story is positive.','Permission from any colleague who knows the client.','No consent if the result is impressive.','Testimonials and case studies need meaningful consent; favorable information can still be confidential.','Testimonials');
add('E',1,'A client tells the coach about a credible immediate risk of serious harm. What is the most appropriate principle?','Follow applicable law and previously explained confidentiality exceptions while prioritizing safety.','Promise absolute secrecy regardless of circumstances.','Post about the situation to seek public advice.','Always tell the sponsor first, whatever the agreement says.','Confidentiality is substantial but not absolute; legal duties and serious safety circumstances may require action.','Safety exception');
add('E',1,'A coach stores client notes on a shared computer without access controls. What is the PRIMARY ethical concern?','The notes are not adequately protected from unauthorized access.','The coach is using a computer instead of paper.','The notes may be too short.','Clients will assume the coach is inexperienced.','The essential requirement is secure, confidential storage, regardless of medium.','Record security');
add('E',1,'A client offers the coach an expensive personal gift. What is the BEST response?','Consider the gift’s meaning, cultural context and potential effect on boundaries, then discuss it transparently.','Accept every gift to avoid offending the client.','Refuse every gift because any gift is a proven violation.','Quietly resell the gift.','Gifts can create conflicts or boundary concerns; context and transparent judgment matter.','Gifts');
add('E',1,'A coach recommends a paid assessment and receives an undisclosed referral fee. What is the key issue?','An unaddressed conflict of interest and lack of transparency about financial benefit.','It is fine because assessments support development.','The fee is ethical if it is less than the coaching fee.','Only the assessment provider needs to know.','Financial incentives should not distort recommendations; disclose relevant compensation and conflicts.','Referral benefits');
add('E',1,'A new client asks what the coaching agreement will cover. Which topic MUST be clarified?','Roles, confidentiality, fees, logistics, expectations and conditions for ending the relationship.','Only the coach’s preferred questioning model.','Only the topics the sponsor wishes to discuss.','The precise number of breakthroughs guaranteed.','A transparent engagement agreement establishes mutual expectations and boundaries.','Engagement agreement');
add('E',1,'The coach realizes that personal frustrations about leadership are affecting how they hear a client. What is the most ethical next step?','Reflect on the bias, manage it and seek supervision or other support if needed.','Tell the client to avoid discussing leadership.','Ignore the feelings because the client cannot detect them.','Steer the client toward the coach’s preferred leadership style.','Self-awareness and responsible management of bias protect the client’s interests.','Coach self-awareness');
add('E',1,'A sponsor asks, “Is this employee ready for promotion?” The coaching contract allows only attendance reporting. What should the coach do?','Share only the information authorized by the agreement, and renegotiate any different reporting with the client involved.','Give a candid promotion rating because it would be helpful.','Send private session notes to justify the rating.','Ask the sponsor to guess from the number of sessions.','A coaching engagement is not covert performance evaluation; sponsorship does not erase boundaries.','Third-party request');
add('E',1,'Which statement about the coach’s qualifications is most appropriate?','Describe credentials and experience accurately without overstating expertise.','Claim an ACC credential once the exam has been booked.','List the credentials of the training organization as personal credentials.','Suggest that coach certification guarantees outcomes.','Professional representations should be truthful and avoid misleading claims.','Accurate representation');
add('E',1,'A coach has an ongoing contract but becomes unable to continue due to a serious illness. What best protects the client?','Communicate promptly and support an appropriate transition or alternative arrangement.','Stop replying until recovered.','Transfer confidential files to a replacement without permission.','Keep charging scheduled fees without disclosure.','Client welfare calls for responsible continuity and communication when coaching cannot continue.','Continuity of service');
add('E',1,'A client requests to end the coaching relationship early. Which response aligns with ethical coaching?','Respect the client’s right to terminate subject to transparently agreed terms.','Insist the client complete all sessions.','Tell the sponsor the client lacks motivation.','Increase the fee to discourage ending.','Clients retain autonomy over the coaching relationship and should know termination arrangements.','Termination');
add('E',1,'In a three-party coaching agreement, who should understand the confidentiality boundaries?','Coach, client and sponsor, with their roles and reporting arrangements made clear.','Only the person who pays.','Only the coach and the client; sponsor obligations are irrelevant.','Only the human resources department.','Clarity with all relevant parties prevents mismatched expectations.','Three-party agreements');
add('E',1,'A coach inadvertently emails a private client note to the wrong recipient. What is the best response?','Take prompt steps to contain the disclosure and follow legal, contractual and ethical obligations.','Delete the sent email and say nothing.','Assume no harm if the file has not been opened.','Publish a public apology including the client’s name.','Data incidents demand proportionate response, not concealment or unnecessary further disclosure.','Data breach');
add('E',1,'A coach suspects an emerging conflict with a client about a separate business deal. What is the safest professional approach?','Disclose and address the competing interest, and change or end the arrangement if objectivity cannot be protected.','Continue until the client notices.','Use the coaching relationship to secure the deal.','Ask the sponsor to decide without involving the client.','Potential conflicts require active management to preserve trust and independence.','Multiple roles');
add('E',1,'A coaching client asks for medical advice about medication. What must the coach do?','Stay within coaching scope and direct medical decisions to an appropriately qualified professional.','Recommend the medication used by a former client.','Research doses during the coaching session.','Tell the client to stop all medication to improve self-reliance.','Clinical advice is outside coaching competency; appropriate referral protects the client.','Scope of practice');
add('E',1,'What is a sound reason for a coach to seek professional supervision or consultation?','To examine an ethical dilemma and improve judgment while preserving client confidentiality.','To transfer decision-making responsibility entirely.','To share memorable identifiable client stories socially.','To obtain approval to ignore the coaching agreement.','Supervision can support ethical decision-making, with privacy safeguards still in place.','Supervision');
add('E',1,'A client wants the coach to provide false attendance details to a sponsor. What is the ethical response?','Decline to misrepresent information and discuss the agreed reporting arrangement.','Do it to preserve the client’s trust.','Send no reports and invoice anyway.','Agree if the client appears embarrassed.','Integrity requires truthful representation even when a client requests otherwise.','Integrity');
add('E',1,'A coach learns a client’s former partner may want to hire them. What is the primary consideration?','Assess conflicts and confidentiality risks before deciding whether the engagement is appropriate.','Tell the former partner what the first client discussed.','Always accept because the relationship has ended.','Use the first client’s progress as marketing.','Intersecting relationships can compromise confidentiality and perceived neutrality.','Competing clients');
add('E',1,'When discussing a client case with a mentor coach, the safest default is to:','Remove identifying details and obtain permission where required by the agreement or context.','Assume coaches may share identifiable client data freely.','Read private emails aloud to the whole cohort.','Use the client’s full name to increase realism.','Seek learning while minimizing identifiable disclosure and honoring agreements.','Mentoring privacy');
add('E',1,'A coach discovers that a partner organization advertises a guaranteed transformation from the coach’s services. What should the coach do?','Correct misleading promises about coaching outcomes.','Ignore the claims because marketing is not coaching.','Repeat the claims to attract more clients.','Blame every unmet result on the client.','Honest communication does not guarantee specific outcomes that depend on the client and context.','Marketing claims');
add('E',1,'A client starts bringing their manager into sessions without prior discussion. What should the coach do?','Clarify roles, consent, confidentiality and how the session’s purpose will be affected.','Allow the manager to direct all future coaching automatically.','Ban all outside participants regardless of client wishes.','Start recording to protect the coach without notice.','Including others changes the engagement and requires clear shared agreement.','Participants');
add('E',1,'Which action is most aligned with ethical respect for cultural differences?','Explore the client’s perspective without imposing the coach’s assumptions about identity or values.','Insist that all clients use the coach’s preferred communication style.','Treat cultural factors as irrelevant to coaching.','Assume every person from the same culture wants the same outcome.','Ethical practice involves cultural sensitivity, non-assumption and respect.','Culture');
add('E',1,'An organization wants to use coaching notes as evidence in an internal investigation. What should guide the coach?','Applicable law and confidentiality agreements, with appropriate professional guidance where necessary.','The preference of whoever has the highest organizational rank.','A personal decision to publish everything.','The coach’s desire to avoid a difficult conversation.','Legal obligations and properly agreed disclosures require careful handling.','Legal disclosure');
add('E',1,'A coach is asked to coach two competing executives. What should be addressed before proceeding?','Potential conflicts, separate confidentiality and whether effective impartial service is possible.','Whether the executives can be made to reveal each other’s goals.','Which executive has the larger coaching budget.','How to combine their confidential notes.','Multiple clients in a competitive relationship need clear separation and conflict assessment.','Multiple clients');
add('E',1,'A client’s financial situation changes and they cannot pay the existing coaching fee. What is most appropriate?','Discuss options and terms openly, without pressuring the client or assuming their priorities.','Threaten to inform their employer.','Increase the price to motivate commitment.','Continue billing secretly.','Transparent financial agreements and respect are preferable to coercion.','Fees');
add('E',1,'A coach uses an untested assessment and presents it as scientifically proven. What is wrong?','The coach is making an unsupported claim about the tool’s validity.','All assessments are prohibited in coaching.','The tool might create too many insights.','Only psychologists may ask questions about assessments.','Use tools responsibly and make accurate claims about their evidence and purpose.','Tool integrity');
add('E',1,'A coach notices that a client is becoming emotionally dependent on the coach for everyday decisions. What is the priority?','Reinforce client autonomy and reassess the relationship, seeking additional support or referral as needed.','Encourage a daily paid session to increase dependence.','Make decisions for the client so they feel safe.','Hide the pattern from the client.','Coaching aims to build agency, not reliance on the coach.','Dependency');
add('E',1,'Which statement most accurately reflects confidentiality?','Its scope and relevant legal exceptions should be discussed clearly before sensitive information is shared.','It means no one can ever disclose any information for any reason.','It applies only to written records.','It belongs solely to the sponsoring organization.','Informed understanding includes the limits of confidentiality and disclosure arrangements.','Confidentiality limits');
add('E',1,'A coach seeks a glowing online review and suggests what a client should write. What is the best ethical concern?','The request may create pressure or a misleading testimonial; protect the client’s free choice and accuracy.','Reviews are automatically forbidden.','Any positive review is proof of a guaranteed result.','The coach should offer a refund only if the client praises them.','Client feedback should be voluntary and truthful.','Client feedback');
add('E',1,'Before using a third-party AI transcription tool for a coaching session, what is essential?','Assess data and confidentiality terms and secure informed client agreement for the use.','Upload first and mention it if the client asks.','Assume every technology provider is confidential.','Post the transcript publicly to test the service.','Digital tools can affect privacy. The ACC exam focuses on the underlying confidentiality principle; newer technology rules also apply in current practice.','Technology privacy');
add('E',1,'A coach learns that they unknowingly gave a client incorrect information about their credential status. What should happen?','Correct the information promptly and accurately.','Wait to see if the client notices.','Remove all mention of credentials from future contracts only.','Ask a friend to verify the inaccurate claim.','Ethical integrity includes correcting misleading professional representations.','Correction');
add('E',1,'The client requests that the coach keep notes but destroy them when the engagement ends. What is best?','Discuss retention and deletion against the agreement and applicable legal requirements.','Promise destruction regardless of mandatory retention obligations.','Keep everything permanently without disclosure.','Give all notes to the sponsor automatically.','Storage and retention must align with informed agreements and applicable rules.','Data retention');
add('E',1,'A coach is also the client’s direct line manager. What is critical to clarify?','Which role is being used, power dynamics, confidentiality and the limits of the coaching relationship.','That performance discussions can be hidden inside coaching.','That the client may never disagree with the manager.','That a managerial role removes ethical obligations.','Dual roles create special power and confidentiality issues.','Manager as coach');
add('E',1,'What is the appropriate ethical response if a client describes persistent severe distress beyond the coach’s expertise?','Explore appropriate referral or additional qualified support while maintaining respectful partnership.','Diagnose the client to show concern.','Ignore it because coaching is only about goals.','Promise the coach can treat the condition.','Recognizing limits and supporting referral is compatible with coaching.','Referral');
add('E',1,'A coach considers sharing a de-identified client story that remains recognizable in a small workplace. What should they do?','Treat re-identification as a confidentiality risk and obtain appropriate consent or omit the story.','Assume removing the name is always sufficient.','Share it because everyone already knows the event.','Only change the person’s job title.','Confidentiality includes information that allows indirect identification.','De-identification');
add('E',1,'A sponsor proposes paying the coach a bonus if a client takes a particular job. What is the main ethical risk?','The incentive could compromise client autonomy and the coach’s impartiality.','All performance incentives are inherently legal violations.','It means the coach no longer needs an agreement.','It guarantees that the client benefits.','Financial incentives linked to a client’s decision can create conflicts and covert agendas.','Sponsor incentive');
add('E',1,'A coach finds that personal values strongly conflict with a client’s chosen career path. What is the best stance?','Stay curious and respectful, manage bias and consider suitability if impartial coaching is not possible.','Persuade the client to adopt the coach’s values.','Pretend all values are the same.','Tell the client that coaching makes their decision correct.','Client choice and dignity matter; the coach does not impose personal values.','Value conflict');
add('E',1,'A coach wants to charge for sessions the client did not attend. What determines whether this is appropriate?','Transparent, previously agreed cancellation and payment terms.','Whatever the coach feels is fair afterward.','The sponsor’s desire to use the budget.','Automatic penalties that were never explained.','Fee and cancellation expectations should be agreed before disputes arise.','Cancellation');
add('E',1,'A coach believes another professional coach may be behaving unethically. What is a responsible first consideration?','Seek a proportionate, respectful response guided by the ethics code and appropriate consultation.','Publicly accuse the coach on social media.','Ignore all misconduct because coaching is confidential.','Tell every client in the network.','Ethical concerns call for thoughtful, appropriate channels, not public speculation.','Ethical concerns');
add('E',1,'A client asks for a copy of information held about their coaching relationship. What is the best guiding approach?','Respond in line with applicable data rights, laws and the coaching agreement.','Deny any request because coach notes always belong only to the coach.','Send another client’s records as an example.','Require the sponsor’s permission in every case regardless of law.','Data handling is subject to legal and contractual responsibilities.','Client records');
add('E',1,'A coach accepts a client while privately knowing they lack the skills to support the stated request. What is the best action?','Be transparent about limitations and discuss suitable alternatives or referral.','Conceal the limitation until several sessions have passed.','Claim that motivation substitutes for competence.','Promise immediate results as reassurance.','Honesty about scope and competence supports informed client choice.','Competence limits');
// BOUNDARIES — 45 original items. B = Definition and Boundaries of Coaching.
add('B',3,'Which statement BEST describes professional coaching?','A partnership that stimulates clients’ thinking and creativity so they can maximize personal and professional potential.','Expert diagnosis followed by a prescribed treatment plan.','Direct instruction on the best way to perform a job.','An assessment of past psychological trauma.','Coaching is a client-centered partnership; clients generate their own insights, goals and choices.','Coaching definition');
add('B',3,'A client requests a detailed industry strategy from the coach’s own experience. Which service are they primarily requesting?','Consulting or advice rather than pure coaching.','Psychotherapy.','Coaching supervision.','Mentor coaching for credentialing.','Expert recommendations are more characteristic of consulting than a client-generated coaching process.','Coaching vs consulting');
add('B',3,'What most clearly distinguishes mentoring from coaching?','Mentoring often draws on a mentor’s experience and guidance; coaching emphasizes the client’s own resourcefulness.','Mentoring always requires a clinical license.','Coaching always involves direct advice.','Mentoring cannot be used for career development.','Mentors may share wisdom from experience, while coaching partners with clients to discover their own answers.','Coaching vs mentoring');
add('B',3,'A participant needs instruction on how to operate new software. Which intervention primarily fits?','Training with demonstrations and practice of defined skills.','Pure non-directive coaching instead of instruction.','Psychotherapy.','Ethics arbitration.','A defined knowledge or skill gap is often best met through training rather than coaching alone.','Coaching vs training');
add('B',1,'A client reports symptoms that seem to require diagnosis and treatment. Which profession should handle that need?','An appropriately qualified mental-health or medical professional.','A coach acting as an unlicensed clinician.','A sponsor acting as a therapist.','A peer using only motivational questions.','Coaches do not diagnose or treat mental health conditions; referrals can accompany coaching.','Coaching vs therapy');
add('B',3,'Which activity is most representative of facilitation rather than individual coaching?','Guiding a group process so participants can work through an agenda together.','Helping one client explore their beliefs about a decision.','Co-creating a private personal development goal.','Asking what one client has learned about themselves.','Facilitation emphasizes group process, coordination and participation.','Coaching vs facilitation');
add('B',3,'At the first meeting, what should the coach clarify about the coaching process?','What coaching includes and excludes, roles, expectations and boundaries.','That the coach will provide all answers.','That measurable outcomes are guaranteed.','That the sponsor may change goals without consultation.','Clear explanation supports informed choice and a sound coaching agreement.','Role clarity');
add('B',3,'An executive says, “Make my team obey me.” What should a coach explore?','The client’s desired outcome and responsibility for their own behavior, without taking over control of others.','A method to force the team to comply.','The names of employees to punish.','A guarantee that coaching will change the team.','Coaching can support the client’s influence and choices, not directly control other people.','Client responsibility');
add('B',3,'What is a common sign that an approach has moved from coaching toward consulting?','The practitioner diagnoses the business problem and recommends their preferred solution.','The practitioner invites the client to generate options.','The client evaluates possible actions.','The client sets their own success measures.','Taking over problem-solving as the expert changes the service being provided.','Directive advice');
add('B',3,'A coach uses a leadership framework. What keeps its use consistent with coaching?','Offer the framework transparently and let the client decide whether and how it is useful.','Require the client to use every stage exactly as written.','Grade the client on accepting the model.','Use it secretly to reach the coach’s preferred answer.','A framework is a tool, not an excuse to take control of the client’s agenda.','Use of frameworks');
add('B',2,'A coach feels responsible for making the client succeed. Which reframing most reflects a coaching mindset?','The coach owns the quality of the process; the client owns choices and actions.','The coach should make all important decisions.','The sponsor alone owns the client’s development.','Failure proves the coach should be more directive.','Coaching honors client agency and clear roles.','Shared responsibility');
add('B',3,'Which is the clearest example of a coaching goal rather than a predetermined task assigned by the coach?','The client identifies how they want to lead difficult conversations and how they will recognize progress.','The coach requires every client to complete the same personality test.','The coach chooses a promotion target for the client.','The coach tells the client to apply for ten jobs.','Coaching goals are co-created and meaningful to the client.','Client-designed goals');
add('B',3,'A sponsor wants the coach to “fix” an employee without the employee knowing the purpose. What is the best response?','Clarify the engagement transparently with the client and sponsor before proceeding.','Begin secret coaching toward the sponsor’s hidden agenda.','Promise to send private thought patterns to HR.','Replace the employee’s goals with the sponsor’s targets.','Coaching agreements require transparency among stakeholders and genuine client participation.','Hidden agenda');
add('B',3,'A client is curious whether coaching is right for them. What is a useful part of the initial conversation?','Assess mutual fit, readiness, goals and any need for a different kind of support.','Sign a long contract before clarifying needs.','Promise coaching is suitable for every challenge.','Withhold the coach’s approach until after payment.','Exploring compatibility supports informed engagement.','Client fit');
add('B',3,'When a client asks the coach to make a decision on their behalf, what is the coaching-consistent response?','Help the client explore relevant priorities and choices while keeping ownership with them.','Choose the safest option for the client.','Ask the sponsor to decide without the client.','Avoid discussing decisions at all.','Coaching supports autonomous decision-making rather than replacing it.','Decision ownership');
add('B',3,'Which feature is most characteristic of psychotherapy compared with coaching?','Clinical assessment or treatment of psychological disorders.','Respectful listening.','Exploring a desired future.','Asking open-ended questions.','Some conversational methods overlap, but diagnosis and treatment belong to properly qualified clinicians.','Clinical treatment');
add('B',3,'What does it mean to partner with a client in coaching?','Collaborate as equals in designing the process while respecting the client’s expertise in their own life.','Assume the coach has superior answers.','Let the sponsor dictate every session.','Eliminate all structure or boundaries.','Partnership combines shared process ownership with client agency.','Partnership');
add('B',3,'During a session, the client wants advice and coaching on the same issue. What is the strongest approach?','Explain the difference, agree which role is appropriate and make any transition explicit.','Switch roles secretly whenever useful.','Refuse to acknowledge that other services exist.','Present all advice as open questions.','Transparent role contracting is key when combining distinct services.','Role switching');
add('B',3,'Which intervention is MOST appropriate when the main objective is improving a specific technical skill through instruction?','Skills training.','Coaching as a substitute for all training.','Clinical counseling.','Conflict adjudication.','Different development needs call for different interventions; instruction is training.','Selecting intervention');
add('B',8,'The client says, “Please make sure I complete my action plan.” What is the best coaching interpretation of accountability?','Partner to design an accountability approach the client chooses and owns.','Take legal responsibility for the client’s performance.','Apply penalties without agreement.','Call the client’s manager after every missed task.','Accountability in coaching is client-led, supported by a mutually agreed structure.','Accountability');
add('B',3,'What distinguishes a coaching session agreement from an overall coaching engagement agreement?','The session agreement focuses on today’s outcome; the engagement agreement covers the broader relationship.','There is no difference and only one can exist.','A session agreement is written only by the sponsor.','An engagement agreement always defines each question to ask.','ICF competency 3 includes both overall engagement contracting and session-level partnering.','Two levels of agreement');
add('B',1,'A client says coaching must be confidential under every imaginable circumstance. What should the coach explain?','Relevant contractual and legal limits must be understood, and no false absolute promise should be made.','The promise is automatic in all jurisdictions.','Confidentiality applies only to recorded calls.','The coach can reveal everything to their spouse.','Coaching confidentiality is robust but bounded by law and properly disclosed arrangements.','Limits of coaching promise');
add('B',2,'What is the primary purpose of coach self-reflection after sessions?','Recognize learning, bias and areas for professional development.','Prove that the client always behaved correctly.','Write better advice to give next time.','Replace supervision permanently.','A reflective practice supports an open, adaptive coaching mindset.','Reflective practice');
add('B',3,'The client is choosing between two roles. Which question is more aligned with coaching than consulting?','“What matters most to you in making this choice?”','“Which one pays most? Take that one.”','“Here is the job I would accept.”','“Why don’t you follow my career plan?”','The coaching question invites client criteria instead of prescribing a solution.','Career choice');
add('B',4,'A client asks whether the coach knows the exact answer. Which response best communicates the nature of coaching?','“My role is to partner with you in exploring what is right for you.”','“I must always know the best answer.”','“I cannot help if you are unsure.”','“Your sponsor will tell us which answer to use.”','Coaching assumes the client has or can develop insight and resourcefulness.','Coach role');
add('B',3,'A client wants the coach to conduct a mediation between two colleagues. What is most accurate?','Mediation is a distinct service with its own role and agreements that should be clarified.','Mediation is automatically included in every coaching contract.','Mediation means instructing both people to agree.','The coach can combine both roles without disclosure.','Related helping services require distinct contracting and competencies.','Mediation boundary');
add('B',3,'A coach is asked to evaluate whether an employee deserves a pay rise. Which role is being requested?','Performance assessment rather than a standard confidential coaching role.','Evoking awareness.','Maintaining presence.','Client-led accountability.','Assessment for a third party is not the same as partnering for the client’s development.','Performance evaluation');
add('B',3,'When is it appropriate to revisit an overall coaching agreement?','When goals, participants, boundaries or circumstances materially change.','Never after the first signature.','Only when the coach wants a larger fee.','Only when the client has achieved every goal.','Agreements remain living frameworks and should be re-examined when relevant conditions change.','Recontracting');
add('B',3,'A client is undecided about coaching goals. What is a coaching-aligned starting point?','Explore what the client would find meaningful to work toward.','Assign a standard goal based on the client’s job title.','Have HR choose privately.','Start a technique without discussing purpose.','The client should participate in defining a meaningful direction.','Goal exploration');
add('B',3,'Which statement about client autonomy is most accurate?','Clients retain authority over the choices they make from coaching insights.','Coaches are responsible for clients following every plan.','Coaches may choose values for clients.','Sponsors own all personal decisions because they pay.','ICF coaching emphasizes self-direction and client responsibility.','Autonomy');
add('B',1,'A client discloses significant substance misuse and asks the coach to provide treatment. What is most appropriate?','Clarify the limits of coaching and explore referral to appropriate treatment support.','Create an unlicensed treatment program.','Tell the client coaching is always enough.','Report private details to the employer automatically.','Coaching cannot replace qualified clinical treatment.','Clinical referral');
add('B',3,'A client asks how a coach measures success. Which response best fits a coaching partnership?','Co-create meaningful measures linked to the client’s desired outcomes.','Use the coach’s standard score for every client.','Guarantee promotion within three months.','Let only the sponsor define all outcomes.','Measures should reflect the client’s goals and context.','Success criteria');
add('B',3,'What is the difference between consulting and coaching in a problem-solving conversation?','Consulting may supply subject-matter solutions; coaching elicits the client’s thinking and decisions.','Consulting always avoids giving recommendations.','Coaching requires technical expertise in the problem.','Consulting cannot involve listening.','Role distinction is about who provides the solution and owns decisions.','Problem solving');
add('B',4,'A client values the coach’s experience in the same industry. How should the coach handle that expectation?','Clarify whether the engagement is coaching, consulting or a transparent blend.','Automatically advise the client in every session.','Use expertise to override the client’s values.','Pretend the industry background does not exist.','Relevant expertise does not remove the need for clear role agreements.','Industry expertise');
add('B',3,'A client says their employer mandated coaching and they do not want to participate. What should the coach explore first?','The client’s willingness, understanding of the arrangement and freedom to choose how to engage.','How to compel compliance for the employer.','A secret performance report on resistance.','A preset homework task.','A meaningful coaching relationship requires informed participation.','Voluntary engagement');
add('B',3,'Which of the following is most likely an outcome of coaching rather than a service performed by the coach?','A client gains clarity, chooses actions and strengthens their own learning.','A coach completes the client’s tasks.','A coach gives a clinical diagnosis.','A coach delivers mandatory technical training.','Coaching creates conditions for client-generated awareness and action.','Coaching outcomes');
add('B',2,'A coach is emotionally triggered by a topic and cannot remain client-focused. What is the professional priority?','Regain self-management and seek support or reschedule if necessary.','Make the client address the coach’s feelings.','Pretend presence can never be impaired.','Switch to telling the client what to do.','Coach self-regulation supports the client-centered relationship.','Emotional regulation');
add('B',3,'A client asks the coach to speak to their manager and negotiate a promotion. What service would that primarily be?','Representation or advocacy rather than coaching.','Active listening.','Evoking awareness.','Facilitating client growth.','Coaching equips the client to act; it does not automatically act as their agent.','Advocacy boundary');
add('B',3,'A coach notices the client expects the coach to function as a friend. What is most helpful?','Discuss the nature of the professional relationship and maintain agreed boundaries.','Encourage emotional dependency to build trust.','Share every detail of the coach’s personal life.','Allow friendship to replace coaching objectives.','Warmth and trust do not remove the need for clear professional roles.','Friendship boundary');
add('B',3,'The sponsor and client have conflicting priorities. What should the coach do?','Facilitate a transparent agreement among relevant parties about goals and information sharing.','Always prioritize the sponsor because it pays.','Always conceal the disagreement from both parties.','Write two incompatible secret coaching goals.','Three-way contracting aligns stakeholders while preserving client autonomy.','Stakeholder alignment');
add('B',3,'Which description best distinguishes coaching from a performance appraisal?','Coaching is a developmental partnership; an appraisal judges performance against criteria.','Both always involve a coach assigning ratings.','A performance appraisal must be confidential from the employer.','Coaching requires the coach to approve the client’s promotion.','Coaching focuses on learning and choice, not organizational ranking.','Appraisal');
add('B',8,'A client says they want the coach to send daily instructions for solving their problems. Which response fits coaching?','Explore the client’s desired support and co-design ways to strengthen their independent choices.','Provide daily mandatory instructions as standard coaching.','Tell the sponsor the client cannot make decisions.','Refuse all structures for accountability.','The purpose is to enhance agency rather than substitute the coach’s decisions.','Independence');
add('B',3,'Which contracting question is most useful at the start of an engagement?','“What do each of us need to understand about goals, responsibilities and confidentiality?”','“Which answers do you want me to provide?”','“How can I guarantee a promotion?”','“Which sponsor secrets should I conceal?”','Agreement covers purpose, scope, responsibility and information boundaries.','Initial contracting');
add('B',1,'If a client needs both coaching and psychological therapy, which approach is most appropriate?','Clarify distinct purposes and coordinate only with appropriate consent and professional boundaries.','Claim coaching should replace therapy.','Combine clinical diagnosis with coaching without qualifications.','Send therapy records to a sponsor.','Services can coexist if scope, confidentiality and roles remain clear.','Parallel support');
add('B',3,'Which statement most accurately describes a client-centered coaching process?','The client’s agenda guides the inquiry, while the coach supports structure and learning.','The coach chooses the outcome and then persuades the client.','The sponsor selects all session topics regardless of client wishes.','The coach supplies a single universal action plan.','Coaching is an intentional partnership, not a standardized set of prescribed answers.','Client-centered approach');
// TECHNIQUES — 60 original items. T = Competencies, strategies and techniques.
add('T',3,'A client says, “I want to work on leadership today.” What is the BEST next coaching step?','Clarify what the client wants to accomplish in this specific session.','Start teaching the coach’s favorite leadership model.','Assume leadership means delegation.','Ask the client to write ten goals before continuing.','Session agreement begins by partnering on a meaningful, concrete outcome for today.','Session outcome');
add('T',3,'Which question most directly supports defining session success?','“How will you know by the end of today that this conversation was useful?”','“Why do you keep making the same mistake?”','“Would you like my solution now?”','“Who is to blame for this?”','Inviting the client to define success clarifies the session agreement.','Measures of success');
add('T',3,'Mid-session, the client introduces a more urgent issue. What best reflects competency 3?','Check whether the client wants to renegotiate the session focus.','Ignore it because the original plan cannot change.','Switch topics without checking what the client wants.','End the session immediately.','The agreement can be revisited as needs emerge.','Changing focus');
add('T',3,'A client wants to discuss “confidence.” What helps establish focus?','Explore what confidence means to them and what they wish to gain from the conversation.','Assume confidence means public speaking.','Give a confidence worksheet immediately.','Tell the client they already have confidence.','Clear client-defined meaning precedes interventions.','Clarify meaning');
add('T',3,'Which action shows partnership in choosing the session direction?','Invite the client to prioritize the topic most useful to explore now.','Set the agenda from the coach’s notes without asking.','Insist on the original six-month plan.','Allow the sponsor to interrupt with unagreed topics.','The client’s agenda and the current agreement guide the session.','Client agenda');
add('T',3,'A client seems unclear why an outcome matters. What is a useful next step?','Ask what makes achieving that outcome important to the client.','Tell the client its importance.','Assume the sponsor’s goal is enough.','Jump to scheduling tasks.','Exploring meaning and motivation deepens the session agreement.','Importance');
add('T',3,'Which question explores what may need to be addressed to achieve a session goal?','“What do you think is getting in the way of that outcome?”','“Do you agree with my diagnosis?”','“Who should I blame?”','“Can we skip the issue and just plan?”','The coach partners to identify the client’s perceived gap or challenge.','Session barriers');
add('T',3,'At the end of an engagement, which process is most appropriate?','Partner with the client to review learning, progress and how they want to close.','Immediately sell another package.','Decide that the client has succeeded without asking.','Send a private grading report to colleagues.','Engagement closure should be mutual and attentive to client learning.','Engagement closure');
add('T',4,'A client describes a fear they have never shared. What most helps cultivate safety?','Listen without judgment and acknowledge the courage of sharing.','Correct the emotion as irrational.','Immediately change to an easier subject.','Share the story with the sponsor to get support.','Acceptance and respect help clients feel safe to explore.','Nonjudgment');
add('T',4,'A coach has an intuition about a pattern in a client’s story. What is the most client-centered way to use it?','Offer it tentatively and invite the client to accept, reject or reshape it.','Declare the interpretation as truth.','Use it as evidence that the coach knows the client better.','Keep repeating it until the client agrees.','Offer observations without attachment to being right.','Tentative observation');
add('T',4,'A client disagrees with the coach’s understanding. What response best builds trust?','Thank them for correcting the understanding and explore their perspective.','Defend the coach’s interpretation.','Tell them disagreement blocks progress.','Move on without acknowledging the correction.','Respect for the client’s perceptions supports trust and safety.','Client disagreement');
add('T',4,'Which statement most demonstrates empathy while preserving coaching partnership?','“This sounds important and difficult; what would be helpful for you to explore?”','“You should not feel that way.”','“I experienced something worse, so I know the answer.”','“Let’s ignore how you feel.”','Empathy recognizes experience without taking over.','Empathy');
add('T',4,'When does vulnerability from the coach most support trust?','When appropriately and briefly shared in service of the client, without shifting the focus.','Whenever the coach needs emotional reassurance.','When used to make the client disclose more.','When it replaces the client’s agenda.','Appropriate authenticity serves the coaching relationship rather than the coach’s needs.','Coach authenticity');
add('T',4,'A coach learns their question had a negative impact. Which action best preserves safety?','Acknowledge the impact and invite the client’s perspective on how to proceed.','Argue that the coach’s intention was positive.','Say the client is too sensitive.','Avoid all further discussion of the moment.','Repair through openness and respect.','Relationship repair');
add('T',4,'What shows respect for a client’s unique strengths?','Notice and acknowledge strengths in ways the client can confirm or expand.','Apply a generic label without listening.','Only praise behavior approved by the sponsor.','Compare the client unfavorably with others.','Client acknowledgment should be authentic and grounded in what is observed.','Client strengths');
add('T',4,'A client is unsure whether to discuss a sensitive matter. The coach should:','Seek permission and affirm the client’s choice about whether to explore it.','Demand disclosure as a condition of coaching.','Tell the client that refusing proves resistance.','Ask the sponsor to authorize the topic instead.','Permission and client choice create psychological safety.','Permission');
add('T',5,'A client pauses for a long time after a question. What is usually the best immediate coaching response?','Allow silence so the client can reflect.','Fill the pause with rapid suggestions.','Repeat the question louder.','Change topics to avoid discomfort.','Silence can support thinking; the coach need not rescue every pause.','Silence');
add('T',5,'The session has shifted unexpectedly into emotion. What does maintaining presence require?','Remain responsive and grounded in what is happening now.','Stick rigidly to a prepared question list.','Quickly suppress the emotion.','Plan the next ten questions while the client speaks.','Presence is flexible and attentive to the unfolding conversation.','Flexibility');
add('T',5,'A client offers a surprising perspective. What reflects openness as a coach?','Follow with genuine curiosity rather than defending an assumption.','Label the perspective incorrect.','Redirect to the coach’s preferred idea.','Ignore the statement because it was unexpected.','Coaching presence includes curiosity without attachment to one interpretation.','Curiosity');
add('T',5,'A coach is preoccupied by their next question and misses what the client just said. Which capability needs attention?','Maintaining presence with the client.','Setting higher fees.','Using a more complex questionnaire.','Creating a longer engagement contract.','Presence requires attunement rather than scripting.','Attention');
add('T',5,'When a coach feels urgency to solve the client’s problem, what is most helpful?','Notice the impulse and return attention to the client’s own exploration.','Offer the fastest solution available.','Shorten the session without discussion.','Tell the client to be less emotional.','Self-regulation allows client-centered inquiry.','Coach impulse');
add('T',5,'Which behavior best demonstrates comfortable use of silence?','Wait attentively while leaving space for the client’s thought process.','Check email during the pause.','Use silence to pressure the client into agreement.','Ask a new question every two seconds.','Silence serves client reflection when accompanied by attention.','Intentional silence');
add('T',5,'A client changes pace and speaks softly while reflecting. How should the coach respond?','Adjust to the client’s energy and listen to what is emerging.','Raise their voice to restore energy.','Insist on a faster tempo.','Read the original session outline aloud.','Presence adapts to client pace and energy.','Adaptability');
add('T',5,'Which practice can help a coach maintain presence before a difficult session?','Use a brief grounding or preparation routine and notice their own state.','Assume preparation is unnecessary for experienced coaches.','Write the client’s answer in advance.','Practice persuading the client.','Coach preparation and self-management support attentive work.','Preparation');
add('T',6,'The client says “I am fine,” but their voice becomes quieter and they look away. What would active listening support?','Offer a neutral observation about the shift and ask what the client notices.','Conclude that the client is lying.','Ignore the change because only words matter.','Demand an explanation for avoiding eye contact.','Listening can include nonverbal cues, considered with humility rather than certainty.','Nonverbal cues');
add('T',6,'Which response best demonstrates reflective listening?','“You want to take the opportunity, and you are worried about its impact on your family.”','“Here are three solutions.”','“That happened to me too; listen to my story.”','“Why would you worry about that?”','A reflection captures key meaning and complexity without prescribing.','Reflecting');
add('T',6,'A client repeatedly uses the word “trapped.” What is a useful coaching response?','Explore what “trapped” means to that client.','Replace the word with “lazy.”','Assume the client needs a new job.','Tell the client to stop using negative language.','Client language often carries unique meaning worth exploring.','Key words');
add('T',6,'A client lists many facts but becomes animated when mentioning a promotion. What may be useful to notice?','The change in energy and what it signals to the client.','Only the chronological accuracy of every fact.','Why the coach dislikes promotions.','Which company should hire the client.','Listening includes tone, energy and emerging values.','Energy shift');
add('T',6,'A client says, “My team never listens.” What is the best listening-oriented next move?','Explore what “never” looks like in the client’s experience.','Agree that the team is disrespectful.','Challenge the team directly.','Prescribe a new meeting structure immediately.','Clarification uncovers meaning instead of reinforcing assumptions.','Clarifying generalizations');
add('T',6,'What is a sign of listening beyond the client’s words?','Noticing emotions, patterns and what remains unsaid, then checking understanding.','Looking only at written notes.','Counting how often a client pauses.','Assuming body language has a universal meaning.','Active listening integrates verbal and contextual information with nonjudgmental checking.','Whole-person listening');
add('T',6,'When the coach summarizes a complex account, what is a strong follow-up?','“What have I captured well, and what have I missed?”','“So my summary is clearly right?”','“You must agree with this interpretation.”','“We can skip your response.”','Checking understanding leaves the client as the authority on their meaning.','Summarizing');
add('T',6,'A client mentions the phrase “being invisible” several times. What could the coach ask?','“When you say ‘invisible,’ what does that mean for you?”','“Who trained you to think that way?”','“Should I tell you how to become visible?”','“Can we choose a more positive word?”','Exploring the client’s own metaphor deepens understanding.','Client metaphor');
add('T',7,'Which question is most likely to evoke fresh client awareness?','“What assumption are you making that might deserve another look?”','“Why haven’t you followed my plan?”','“Would you agree my solution is best?”','“Can we stop exploring and copy this template?”','Awareness questions invite new perspectives without controlling the answer.','Challenge assumptions');
add('T',7,'A client identifies a recurring pattern of avoiding conflict. What is a useful next coaching move?','Invite the client to explore what they notice about the pattern and its impact.','Label the client as conflict-avoidant permanently.','Explain the coach’s own theory as fact.','Insist the client confront someone today.','Exploring patterns promotes client-generated insight.','Pattern recognition');
add('T',7,'What makes a coaching question “powerful” in ICF terms?','Its relevance to the client’s thinking and potential for new learning.','Its length and complexity.','Its ability to demonstrate the coach’s expertise.','Its tendency to force one specific answer.','Questions are valuable for the awareness they evoke, not for theatrical wording.','Question quality');
add('T',7,'A coach notices a discrepancy between a client’s values and planned action. What might evoke awareness?','“How does this action fit with the values you named?”','“Your plan is obviously wrong.”','“Use my values instead.”','“Why are you inconsistent?”','An open, respectful exploration of incongruence can invite insight.','Values alignment');
add('T',7,'Which question most opens up possibilities?','“What other options can you see from here?”','“Is option A not obviously the best?”','“Will you copy my plan?”','“What would make you stop thinking?”','Expansive questions invite more than one path and support agency.','New possibilities');
add('T',7,'The client says, “I am a failure.” What is a coaching-consistent response?','Explore what the statement means to the client and whether another perspective is possible.','Tell the client they are definitely a failure.','Give an instant diagnosis.','Argue until the client admits they are successful.','Curious exploration of limiting beliefs supports insight without imposing a judgment.','Beliefs');
add('T',7,'A coach offers an observation. Which wording most protects client ownership?','“I noticed something; would you like to hear it and see whether it fits?”','“I know the real cause of your problem.”','“My observation should become your new belief.”','“You must use this insight.”','Permission-based, non-attached observations invite awareness.','Coach observation');
add('T',7,'A client uses an image of “carrying a heavy backpack.” Which response may best foster awareness?','“What is in that backpack for you, and what might you want to do with it?”','“That metaphor is wrong.”','“Let me explain what the backpack really means.”','“Buy a lighter backpack.”','Exploring a client-created metaphor can reveal meaning and options.','Metaphor');
add('T',7,'Which is a possible purpose of gently challenging a client?','Help them examine assumptions and see alternatives, without humiliating or pressuring them.','Prove the coach is more knowledgeable.','Force the client to adopt the coach’s view.','Replace trust with confrontation.','Effective challenge is respectful and in service of client awareness.','Challenge');
add('T',7,'What does it mean to move from “the situation” to “the person” in coaching inquiry?','Explore who the client is being, believing or becoming in relation to the situation.','Switch to diagnosing the client.','Ignore the situation entirely.','Ask only biographical questions.','Coaching can deepen learning by exploring beliefs, values and identity relevant to goals.','Who vs what');
add('T',7,'A client has identified that perfectionism is slowing them. What question might deepen insight?','“What is perfectionism protecting or costing you here?”','“Can you stop being a perfectionist immediately?”','“Would you like my five-step fix?”','“Isn’t perfectionism always good?”','Exploration of benefits and costs supports the client’s own understanding.','Underlying pattern');
add('T',7,'The client discovers a new perspective. What is a useful immediate next move?','Give space for the client to articulate what the insight means to them.','Rush to the next prepared question.','Tell the client why the insight is not new.','Convert it into coach-assigned homework before discussing it.','Allowing learning to land supports integration and meaning.','Integrating awareness');
add('T',8,'At the end of a session, which question most directly supports client growth?','“What learning do you want to take forward from today?”','“Can I grade your effort?”','“Why did you not ask for more advice?”','“Do you agree my technique worked?”','Client reflection connects insights to ongoing learning.','Learning reflection');
add('T',8,'A client identifies three possible actions. What best supports ownership?','Invite the client to choose and shape a step aligned with their goals.','Pick the boldest step for them.','Insist they do all three by tomorrow.','Contact their manager with instructions.','Action plans in coaching belong to the client.','Action selection');
add('T',8,'Which question best supports a client-designed accountability plan?','“How would you like to hold yourself accountable for this commitment?”','“May I punish you if you forget?”','“Can I choose your consequences?”','“Should I copy your sponsor into every email?”','Accountability is co-created and tailored to the client.','Accountability design');
add('T',8,'The client proposes an ambitious change. What is the coach’s most helpful next response?','Explore what could support or hinder implementing the change.','Guarantee the plan will work.','Reject the idea as too risky.','Take over the implementation.','Identifying resources and obstacles strengthens action planning.','Resources and barriers');
add('T',8,'Which question helps translate insight into concrete progress?','“What specific step would you like to take, and when?”','“Should I send you my full action plan?”','“Why do you always delay?”','“Can we avoid committing to anything?”','The client converts awareness into self-chosen action.','Next step');
add('T',8,'A client ends the session without wanting any immediate action. What is a coaching-consistent approach?','Explore how they want to integrate the learning, respecting their chosen pace.','Force an action for every session.','Mark the session as failed automatically.','Assign an unrelated task to prove rigor.','Growth can include reflection or new awareness, not only task completion.','Integration');
add('T',8,'How can a coach help a client celebrate progress?','Invite the client to acknowledge the learning and achievements meaningful to them.','Give praise only for outcomes the coach prefers.','Compare them with other clients.','Say celebration reduces motivation.','Noticing progress reinforces learning without making approval conditional.','Celebrating progress');
add('T',8,'A client struggled to complete a chosen action. What is the most supportive question?','“What did you learn about what helped or got in the way?”','“Why did you fail again?”','“Shall I report this to your boss?”','“Would you like me to take charge?”','Nonjudgmental reflection turns difficulty into learning.','Learning from setbacks');
add('T',8,'What is the coach’s role in designing actions?','Partner with the client to develop ideas that reflect the client’s learning and context.','Prescribe the coach’s standard list.','Make all decisions on feasibility.','Require actions that impress the sponsor.','The coach supports, rather than controls, client-designed action.','Action partnership');
add('T',8,'What indicates that a coaching session has closed with learning?','The client articulates useful insight or progress and how they may use it.','The coach presents an extended lecture.','The coach scores the client against personal expectations.','The sponsor is informed of every private insight.','Client integration is central to facilitating growth.','Session closing');
add('T',8,'The client has many possible support resources. How might the coach best proceed?','Invite the client to identify which resources they want to use and how.','Choose the cheapest resource for them.','Prohibit support from other people.','Assign a mandatory mentor without consent.','Client-led resource selection promotes ownership.','Support structures');
add('T',8,'A client has achieved a long-term objective. What best supports sustainable growth?','Explore how learning can be carried forward after coaching ends.','Tell the client growth stops without the coach.','Require indefinite weekly sessions.','Replace the goal with the coach’s priority.','The goal is sustainable client capability, not dependence.','Sustainability');
add('T',8,'Which question invites commitment without pressure?','“What, if anything, are you willing to commit to before we next meet?”','“Promise you will do exactly what I say.”','“Why won’t you commit to my plan?”','“May I put your name on the sponsor’s list?”','Commitments are freely chosen by the client.','Commitment');
add('T',8,'At the end of the coaching relationship, what is an appropriate role for the coach?','Partner with the client to acknowledge progress and identify how to sustain learning.','Keep extending sessions without discussing value.','Judge the client’s personal worth.','Send confidential results to marketing.','Respectful closure consolidates growth and autonomy.','Ending engagement');
add('T',2,'Which behavior most clearly illustrates a coaching mindset?','Remaining open to being wrong and curious about the client’s worldview.','Assuming the coach’s framework fits everyone.','Showing certainty in all interpretations.','Pressuring the client to agree.','An open, flexible, client-centered mindset is a foundation for skillful coaching.','Open mindset');
add('T',2,'A coach recognizes an unconscious assumption about a client’s age. What best reflects learning?','Examine the assumption and return to the client’s actual perspective.','Use the assumption as a shortcut.','Hide the assumption and never reflect.','Tell the client that people their age always behave alike.','Awareness of bias enables more individual, respectful coaching.','Cultural humility');
add('T',2,'Why is continuous development important for coaches?','It supports ethical, responsive practice and growth in professional capability.','It substitutes for following the ethics code.','It ensures every client reaches identical results.','It makes client feedback unnecessary.','Ongoing learning and reflective practice are part of competency 2.','Coach development');
add('T',2,'A coach receives challenging feedback from a client. What reflects a growth mindset?','Listen with curiosity, reflect and decide what to learn or change.','Dismiss it as evidence of a resistant client.','Demand positive feedback instead.','Explain why the coach cannot be wrong.','Feedback is information to examine, not a threat to defend against.','Feedback openness');
add('T',6,'The coach notices that the client has become increasingly silent when discussing their manager. What would active listening suggest?','Notice the change without assuming its meaning and invite the client to explore it.','Interpret the silence as fear with certainty.','Ignore all shifts in energy.','Call the manager during the session.','Observations should be offered tentatively and checked with the client.','Listening for shifts');
add('T',7,'Which coaching question is least leading?','“What options might you consider?”','“Wouldn’t confronting your manager be best?”','“Don’t you think your team is wrong?”','“Isn’t the answer to resign?”','Open questions avoid smuggling the coach’s preferred response into the question.','Nonleading questions');
add('T',5,'A coach catches themself mentally preparing a response during the client’s story. What should happen?','Refocus on hearing the client before choosing any response.','Interrupt to deliver the prepared thought.','Record the story and listen another day.','Ask the client to stop so the coach can plan.','Attention to the present conversation is more important than clever questions.','Presence over performance');
add('T',4,'A client becomes tearful while recalling a disappointing moment. What is an appropriate immediate response?','Acknowledge the emotion, allow space and check what the client needs.','Immediately offer a diagnosis.','Change the subject because emotions are outside coaching.','Tell the client to stop crying.','Coaches can hold space for emotion while monitoring scope and safety.','Emotional safety');
add('T',8,'A client wants to define progress between meetings. Which approach is strongest?','Invite the client to choose evidence of progress that matters to them.','Choose only metrics the coach can easily count.','Use a standard target without discussion.','Request daily confidential updates from the sponsor.','Client-chosen progress indicators support relevant accountability.','Progress measures');
add('T',7,'The coach asks “Why didn’t you do it?” and the client appears defensive. What might improve the inquiry?','Shift to a curious question such as “What got in the way?”','Repeat the accusation more forcefully.','Assume defensiveness proves a bad client.','Insist on a yes-or-no confession.','Curiosity is often more generative than blame.','Constructive inquiry');
add('T',3,'The client says the original session aim has been met halfway through. What might the coach do?','Check what the client would now like to focus on or gain from the remaining time.','Keep asking the original questions automatically.','End immediately without discussing choice.','Create a new goal for the client.','Session focus can be revisited collaboratively throughout.','Recontracting in session');
add('T',6,'When listening across cultures, what is a useful precaution?','Ask what particular expressions or pauses mean to the individual rather than assuming.','Apply a universal interpretation of eye contact.','Treat a quiet voice as lack of confidence.','Assume everyone shares the coach’s norms.','Context and cultural humility improve listening accuracy.','Listening and culture');
add('T',8,'The coach notices the client underestimates their progress. What could help?','Invite the client to look back at what has changed and what they made possible.','Tell the client their feelings are invalid.','Make a performance rating without discussion.','Claim all progress belongs to the coach.','Reflection on real progress fosters self-recognition and motivation.','Acknowledging growth');
add('T',7,'The client says they have only two options and both are unsatisfying. What might evoke awareness?','“What possibilities might exist beyond those two?”','“Then choose the first.”','“You are making this too difficult.”','“I have made the decision for you.”','Exploring perceived constraints can reveal new options.','Reframing possibilities');
add('T',4,'A client asks not to discuss a painful memory further. What is the appropriate response?','Respect the boundary and partner on what feels useful now.','Keep probing until the client explains.','Insist avoidance means coaching failure.','Share the topic with the sponsor to gain pressure.','The client controls what they disclose and explore, consistent with trust and safety.','Client choice');
add('T',5,'A coach is unsure how to respond to a deeply personal client discovery. What is a wise approach?','Remain present and curious, allowing space rather than forcing a clever intervention.','Rush to fill the silence.','Pretend to know the interpretation.','Switch to a prepared lecture.','Presence sometimes matters more than the next question.','Holding uncertainty');
add('T',2,'Which habit builds long-term coaching competence?','Reflecting after sessions and using feedback and development to improve practice.','Using identical scripts with every client.','Never discussing difficult cases with a qualified supervisor.','Avoiding continuing education.','Reflective learning is part of embodying a coaching mindset.','Learning habit');
add('T',1,'During a session a coach realizes the client’s request may require clinical support. What should guide their response?','Respect coaching limits and discuss appropriate professional support.','Begin diagnosing the client.','Promise treatment through coaching.','Keep the issue secret even from the client.','Ethical practice includes recognizing boundaries and referral when appropriate.','Ethics in session');
const DOMAINS={E:{name:'Coaching Ethics',weight:30,desc:'Confidentiality, conflicts, truthful representation and professional conduct.'},B:{name:'Definition & Boundaries',weight:30,desc:'What coaching is—and when consulting, training, mentoring or therapy is more appropriate.'},T:{name:'Competencies & Techniques',weight:40,desc:'Applying eight core competencies to agreements, presence, insight and growth.'}};
const COMP=[null,
{name:'Demonstrates Ethical Practice',area:'A · Foundation',intro:'Work honestly, respect client diversity, protect privacy, maintain clear boundaries and refer appropriately.',outcome:'Apply ethical reasoning before, during and after a coaching engagement.',concepts:[['Confidentiality with limits','Agree in advance what is confidential, what can be reported to sponsors and what laws or safety exceptions may apply. Secure all notes, recordings and other client data.'],['Manage conflicts of interest','Recognize financial incentives, multiple roles, dual relationships and other circumstances that could impair objectivity. Disclose and address rather than conceal them.'],['Know the boundaries','Coaching is not treatment or expert advice. When a client needs specialist services, discuss referrals, coordinating only with proper permission.'],['Represent your practice accurately','Use truthful credentials, marketing claims, fees, scope, agreements and testimonials. Respect client choice and avoid pressure.']],pitfalls:['Thinking the paying sponsor automatically receives confidential session content.','Promising confidentiality without any legal exceptions.','Assuming a coach can diagnose mental health issues or prescribe treatment.','Keeping a potential conflict of interest hidden.'],example:'An HR sponsor wants details of what an employee said in coaching. The coach returns to the reporting agreement, protects the client’s confidentiality and involves the client in any change.'},
{name:'Embodies a Coaching Mindset',area:'A · Foundation',intro:'Stay open, curious, flexible and client-centered; engage in continued learning and reflective practice.',outcome:'Prepare and regulate yourself so the client’s thinking—not yours—guides the session.',concepts:[['Client resourcefulness','Assume the client can develop their own ideas and own their decisions. Support agency rather than dependence.'],['Reflective practice','After sessions, ask what assumptions, biases, strengths or limitations influenced your work. Seek mentoring, supervision and feedback when useful.'],['Coach self-regulation','Notice emotional triggers and desire to rescue, advise or prove expertise. Return attention to what serves the client.'],['Cultural humility','Consider different experiences, contexts, identities and expectations; ask rather than assuming you know their meaning.']],pitfalls:['Mistaking your own good solution for the client’s goal.','Thinking senior coaches no longer need learning or supervision.','Labeling a client from stereotypes about their culture or background.','Treating feedback as an attack.'],example:'A client questions your interpretation. Rather than defend it, you thank them and explore their actual meaning.'},
{name:'Establishes & Maintains Agreements',area:'B · Co-Creating the Relationship',intro:'Co-design expectations for the overall engagement AND for each session.',outcome:'Partner on desired outcomes, measures of success and what matters now.',concepts:[['Engagement-level contract','Clarify coaching roles, sponsor roles, fees, logistics, confidentiality, scope, goals, responsibilities, boundaries and termination.'],['Session-level agreement','At the beginning of each conversation, ask what the client wants to accomplish, why it matters and how they will know it was useful.'],['Explore significance and obstacles','Identify what the client believes needs attention to reach the outcome; avoid substituting your own diagnosis.'],['Recontract when needed','As priorities or circumstances shift, check whether to refocus. The agreement is a living partnership, not a rigid agenda.']],pitfalls:['Starting with techniques without knowing the client’s goal.','Replacing the client’s purpose with a sponsor’s hidden agenda.','Assuming a broad engagement goal is enough for every session.','Ignoring the opportunity to renegotiate focus.'],example:'“I want to discuss work.” → “What about work would be most valuable to explore today, and what would you like to leave with?”'},
{name:'Cultivates Trust & Safety',area:'B · Co-Creating the Relationship',intro:'Create a respectful environment where the client can be honest, vulnerable and autonomous.',outcome:'Build psychological safety through empathy, appreciation and nonjudgment.',concepts:[['Respect the person','Recognize the client’s identity, context, values, perceptions and way of communicating.'],['Demonstrate empathy','Acknowledge what the client experiences without taking over, minimizing or diagnosing.'],['Ask permission','Give clients meaningful choice when entering sensitive areas, offering observations or exploring a difficult topic.'],['Repair and remain authentic','Admit misunderstandings, welcome corrections and use appropriate authenticity without shifting focus to the coach.']],pitfalls:['Mistaking disagreement for client resistance.','Pressuring a client to share more than they want to.','Using your own life story as the center of the session.','Assuming a warm tone substitutes for confidentiality.'],example:'“I notice this topic seems sensitive. Would you like to explore it, or would another direction be more useful?”'},
{name:'Maintains Presence',area:'B · Co-Creating the Relationship',intro:'Be fully conscious and responsive to the client and whatever emerges in the moment.',outcome:'Follow the conversation with curiosity, composure and flexibility.',concepts:[['Attention over performance','Listen rather than planning a clever intervention. Let the client guide what deserves attention.'],['Use silence productively','Provide space for reflection and discovery; silence is not a coaching problem to fill.'],['Manage inner reactions','Recognize urgency, distraction and personal emotion without making them the client’s burden.'],['Adapt as the session unfolds','Respond to energy, pace, shifts in focus and uncertainty instead of clinging to a script.']],pitfalls:['Filling every pause with another question.','Thinking about the next technique while the client is speaking.','Using silence to pressure compliance.','Enforcing a script even after the client shifts priorities.'],example:'After a difficult question, the client becomes silent. The coach waits attentively and follows what the client brings next.'},
{name:'Listens Actively',area:'C · Communicating Effectively',intro:'Understand the client’s words, values, emotions, energy and context, without inserting assumptions.',outcome:'Reflect meaning and notice the whole communication.',concepts:[['Attend to words and patterns','Notice important repeated phrases, themes, metaphors, beliefs and what is emphasized or not said.'],['Attend to nonverbal cues','Observe pace, tone, pauses and body language; do not assume they mean the same thing for everyone.'],['Reflect and summarize','Offer concise reflections, then check whether you understood correctly.'],['Listen through the client’s lens','Explore what the client’s own expressions mean in their environment and experience.']],pitfalls:['Assuming a tone or gesture proves a single emotion.','Turning a reflection into advice.','Focusing on facts while missing emotion or meaning.','Listening mainly for an opportunity to intervene.'],example:'“You said ‘stuck’ three times. What does being stuck mean to you right now?”'},
{name:'Evokes Awareness',area:'C · Communicating Effectively',intro:'Support insight using powerful questions, thoughtful observations, metaphor and exploration of perspectives.',outcome:'Help the client discover assumptions, patterns, possibilities and what truly matters.',concepts:[['Explore beyond the obvious','Ask about beliefs, values, identity, habits, relationships and perspectives.'],['Ask open, nonleading questions','Questions should stimulate the client’s thinking, not smuggle in your preferred answer.'],['Offer observations lightly','With permission, share what you notice without attachment to whether the client agrees.'],['Work with client-created language','Metaphors, contradictions and recurring themes can reveal fresh awareness. Give the client room to interpret them.']],pitfalls:['Leading questions disguised as coaching.','Using a sophisticated question that does not serve the client.','Treating the coach’s interpretation as fact.','Rushing past a meaningful insight without exploring it.'],example:'“You said independence is a core value, but this choice seems to limit it. What do you notice when you hear that?”'},
{name:'Facilitates Client Growth',area:'D · Cultivating Learning and Growth',intro:'Partner to transform insight into personally meaningful development, action and accountability.',outcome:'Support the client to integrate new learning and make their own sustainable choices.',concepts:[['Integrate learning','Invite clients to name insights about themselves and their situation and how they may apply them.'],['Client-designed actions','Explore possibilities, resources, obstacles and concrete next steps while allowing clients to choose.'],['Accountability as partnership','Ask what support and follow-through structures the client wants; do not control or shame them.'],['Celebrate and close','Recognize growth, review progress and help clients sustain learning as sessions or engagements end.']],pitfalls:['Assigning homework the client did not choose.','Treating every session without a task list as failure.','Punishing a client for missed actions instead of learning from them.','Making the client dependent on the coach for decisions.'],example:'“Which insight matters most today? What, if anything, do you want to do with it, and how will you support yourself?”'}
];
